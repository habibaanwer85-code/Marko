  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  body {
    font-family: 'Inter', 'Tajawal', sans-serif;
    background: #f4f5f6;
    background-image: radial-gradient(circle at 85% -10%, rgba(51,53,58,0.13), transparent 45%);
    color: #1f2124;
  }
  #root { height: 100vh; height: 100dvh; }

  .app-shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 270px;
    flex-shrink: 0;
    background: #ffffff;
    border-inline-start: 1px solid rgba(31,33,36,0.08);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    transition: margin-inline-start 0.25s ease;
    position: relative;
    z-index: 20;
  }
  .sidebar.closed { margin-inline-start: -270px; }
  .sidebar-header { padding: 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(31,33,36,0.08); }
  .sidebar-logo { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; }
  .sidebar-title { font-weight: 800; font-size: 14.5px; }

  .sidebar-tabs { display: flex; gap: 4px; padding: 10px 10px 4px; }
  .sidebar-tab {
    flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; cursor: pointer;
    font-size: 11.5px; font-weight: 700; color: rgba(31,33,36,0.55);
    border: 1px solid transparent; transition: all 0.15s;
  }
  .sidebar-tab.active { background: rgba(85,88,92,0.14); color: #55585c; border-color: rgba(85,88,92,0.3); }
  .sidebar-tab:hover:not(.active) { background: rgba(31,33,36,0.05); }

  .new-chat-btn {
    margin: 10px 14px 6px;
    display: flex; align-items: center; gap: 8px;
    background: #e8e9eb; border: 1px solid rgba(85,88,92,0.3); color: #1f2124;
    border-radius: 10px; padding: 10px 12px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 13.5px; font-weight: 700;
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
  }
  .new-chat-btn:hover { border-color: #55585c; background: #e6e7e9; }
  .conv-list { flex: 1; overflow-y: auto; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 3px; }
  .conv-list::-webkit-scrollbar { width: 4px; }
  .conv-list::-webkit-scrollbar-thumb { background: rgba(31,33,36,0.12); border-radius: 4px; }
  .conv-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 10px; border-radius: 9px; cursor: pointer;
    font-size: 13px; color: rgba(31,33,36,0.75);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background 0.15s;
  }
  .conv-item:hover { background: rgba(31,33,36,0.06); }
  .conv-item.active { background: rgba(85,88,92,0.14); color: #1f2124; }
  .conv-item span.label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-delete { opacity: 0; flex-shrink: 0; background: transparent; border: none; color: rgba(31,33,36,0.5); cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .conv-item:hover .conv-delete { opacity: 1; }
  .conv-delete:hover { color: #e08080; }
  .sidebar-empty { padding: 16px 14px; font-size: 12.5px; color: rgba(31,33,36,0.4); line-height: 1.7; }

  .sidebar-nav-btn {
    margin: 10px 14px 6px; display: flex; align-items: center; gap: 8px;
    background: transparent; border: 1px solid rgba(31,33,36,0.12); color: rgba(31,33,36,0.8);
    border-radius: 10px; padding: 10px 12px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: border-color 0.2s;
  }
  .sidebar-nav-btn:hover { border-color: #55585c; color: #55585c; }
  .brand-status { padding: 10px 14px; font-size: 11.5px; color: rgba(31,33,36,0.45); line-height: 1.7; }
  .brand-status.set { color: #55585c; }

  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 15; display: none; }
  .sidebar-overlay.show { display: block; }

  /* ---------- Auth / Welcome gate ---------- */
  .auth-shell {
    height: 100vh; height: 100dvh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden;
  }
  .auth-shell::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 15% 10%, rgba(51,53,58,0.16), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(85,88,92,0.10), transparent 50%);
    pointer-events: none;
  }
  .auth-card {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    background: #ffffff; border: 1px solid rgba(31,33,36,0.09);
    border-radius: 20px; padding: 34px 30px 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .auth-logo-row { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 6px; }
  .auth-logo-row img { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; }
  .auth-title { font-size: 21px; font-weight: 900; text-align: center; margin: 4px 0 2px; }
  .auth-sub { font-size: 12.5px; color: rgba(31,33,36,0.5); text-align: center; margin: 0 0 22px; line-height: 1.7; }
  .auth-tabs { display: flex; gap: 6px; background: #f4f5f6; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .auth-tab { flex: 1; text-align: center; padding: 9px 4px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 700; color: rgba(31,33,36,0.5); transition: all 0.15s; }
  .auth-tab.active { background: #e8e9eb; color: #2a2c2e; }
  .auth-field { margin-bottom: 13px; }
  .auth-field label { display: block; font-size: 11.5px; color: rgba(31,33,36,0.55); margin-bottom: 6px; font-weight: 700; }
  .auth-field input {
    width: 100%; background: #f4f5f6; border: 1px solid rgba(31,33,36,0.12); color: #1f2124;
    border-radius: 10px; padding: 11px 13px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 14px;
    outline: none; transition: border-color 0.15s;
  }
  .auth-field input:focus { border-color: #2a2c2e; }
  .auth-error { color: #e08080; font-size: 12px; margin: 2px 0 12px; text-align: center; }
  .auth-submit {
    width: 100%; background: linear-gradient(135deg, #2a2c2e, #1c1e20); color: #ffffff; border: none;
    border-radius: 11px; padding: 13px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 14.5px; font-weight: 900;
    cursor: pointer; margin-top: 6px; transition: filter 0.15s;
  }
  .auth-submit:hover { filter: brightness(1.08); }
  .auth-note { text-align: center; font-size: 10.5px; color: rgba(31,33,36,0.35); margin-top: 18px; line-height: 1.7; }

  /* ---------- Overview / Command Center ---------- */
  .ov-wrap { max-width: 980px; margin: 0 auto; padding: 22px 4px 40px; }
  .ov-greeting { font-size: 22px; font-weight: 900; margin: 0 0 4px; }
  .ov-sub { font-size: 13px; color: rgba(31,33,36,0.5); margin: 0 0 22px; }
  .ov-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  @media (max-width: 720px) { .ov-kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .ov-kpi-card { background: #f0f1f2; border: 1px solid rgba(31,33,36,0.08); border-radius: 14px; padding: 15px 16px; }
  .ov-kpi-label { font-size: 11px; color: rgba(31,33,36,0.5); margin-bottom: 6px; font-weight: 700; }
  .ov-kpi-value { font-size: 22px; font-weight: 900; color: #1f2124; }
  .ov-kpi-sub { font-size: 10.5px; color: rgba(31,33,36,0.4); margin-top: 4px; }
  .ov-attn { background: linear-gradient(135deg, rgba(51,53,58,0.14), rgba(51,53,58,0.04)); border: 1px solid rgba(51,53,58,0.35); border-radius: 14px; padding: 18px 20px; margin-bottom: 22px; }
  .ov-attn-title { font-size: 12.5px; font-weight: 900; color: #4b4e52; margin-bottom: 8px; letter-spacing: 0.3px; }
  .ov-attn-body { font-size: 14px; line-height: 1.9; color: #1f2124; margin-bottom: 12px; }
  .ov-attn-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .ov-btn { background: #2a2c2e; color: #ffffff; border: none; border-radius: 9px; padding: 9px 16px; font-family: 'Inter', 'Tajawal', sans-serif; font-weight: 800; font-size: 12.5px; cursor: pointer; }
  .ov-btn.ghost { background: transparent; border: 1px solid rgba(31,33,36,0.2); color: #1f2124; }
  .ov-section-title { font-size: 13px; font-weight: 900; color: rgba(31,33,36,0.75); margin: 4px 0 12px; }
  .ov-priorities { display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px; }
  .ov-priority { display: flex; align-items: center; gap: 10px; background: #f0f1f2; border: 1px solid rgba(31,33,36,0.08); border-radius: 11px; padding: 11px 14px; font-size: 13.5px; cursor: pointer; }
  .ov-priority:hover { border-color: rgba(51,53,58,0.4); }
  .ov-quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 720px) { .ov-quick-grid { grid-template-columns: repeat(2, 1fr); } }
  .ov-quick-card { background: #f0f1f2; border: 1px solid rgba(31,33,36,0.08); border-radius: 13px; padding: 16px 14px; cursor: pointer; text-align: center; transition: border-color 0.15s, transform 0.15s; }
  .ov-quick-card:hover { border-color: #2a2c2e; transform: translateY(-2px); }
  .ov-quick-icon { font-size: 22px; display: block; margin-bottom: 8px; }
  .ov-quick-title { font-size: 12.5px; font-weight: 800; }

  /* ---------- Floating Ask MARKO ---------- */
  .ask-marko-fab {
    position: fixed; bottom: 22px; left: 22px; z-index: 40;
    background: linear-gradient(135deg, #2a2c2e, #1c1e20); color: #ffffff; border: none;
    border-radius: 999px; padding: 12px 18px; font-family: 'Inter', 'Tajawal', sans-serif; font-weight: 900; font-size: 13px;
    display: flex; align-items: center; gap: 7px; cursor: pointer; box-shadow: 0 10px 26px -8px rgba(51,53,58,0.5);
  }
  .ask-marko-panel {
    position: fixed; bottom: 78px; left: 22px; z-index: 41; width: 320px; max-width: calc(100vw - 44px);
    background: #ffffff; border: 1px solid rgba(31,33,36,0.12); border-radius: 16px; padding: 14px;
    box-shadow: 0 24px 50px -16px rgba(0,0,0,0.6);
  }
  .ask-marko-panel h4 { margin: 0 0 10px; font-size: 13px; font-weight: 900; color: #4b4e52; }
  .ask-marko-panel textarea {
    width: 100%; min-height: 64px; background: #f4f5f6; border: 1px solid rgba(31,33,36,0.12); color: #1f2124;
    border-radius: 9px; padding: 9px 11px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 13px; resize: none; outline: none;
  }
  .ask-marko-panel .row { display: flex; gap: 8px; margin-top: 8px; }

  /* ---------- Main area ---------- */
  .main-area { flex: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-width: 0; }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid rgba(31,33,36,0.08); flex-shrink: 0; }
  .hamburger { width: 38px; height: 38px; border-radius: 9px; background: transparent; border: 1px solid rgba(31,33,36,0.15); color: rgba(31,33,36,0.8); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }
  .hamburger:hover { border-color: #55585c; color: #55585c; }
  .topbar .logo-img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .topbar .title-block h1 { margin: 0; font-size: 16.5px; font-weight: 900; }
  .topbar .title-block p { margin: 1px 0 0; font-size: 10.5px; color: rgba(31,33,36,0.5); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.4px; }
  .save-btn { margin-inline-start: auto; background: transparent; border: 1px solid rgba(31,33,36,0.15); color: rgba(31,33,36,0.7); border-radius: 10px; padding: 8px 12px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: border-color 0.2s, color 0.2s; }
  .save-btn:hover { border-color: #55585c; color: #55585c; }

  .stage-rail { display: flex; align-items: center; padding: 12px 16px 0; flex-shrink: 0; }
  .stage-node { display: flex; align-items: center; flex: 1; }
  .stage-node:last-child { flex: 0; }
  .stage-dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(31,33,36,0.25); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: rgba(31,33,36,0.45); flex-shrink: 0; transition: all 0.3s ease; }
  .stage-node.on .stage-dot { border-color: #2a2c2e; background: #2a2c2e; color: #ffffff; font-weight: 700; }
  .stage-label { font-size: 10px; color: rgba(31,33,36,0.4); margin-inline-start: 6px; margin-inline-end: 10px; white-space: nowrap; display: none; }
  .stage-node.on .stage-label { color: rgba(31,33,36,0.75); }
  .stage-line { flex: 1; height: 1.5px; background: rgba(31,33,36,0.15); margin: 0 4px; }
  .stage-line.on { background: #2a2c2e; }
  @media (min-width: 680px) { .stage-label { display: inline; } }

  .content-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 12px 16px; }
  .content-area::-webkit-scrollbar { width: 5px; }
  .content-area::-webkit-scrollbar-thumb { background: rgba(31,33,36,0.15); border-radius: 4px; }

  .landing { max-width: 520px; margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }
  .landing-logo { width: 78px; height: 78px; border-radius: 20px; object-fit: cover; box-shadow: 0 8px 30px rgba(51,53,58,0.18); margin-bottom: 20px; }
  .landing-title { font-size: 24px; font-weight: 900; margin: 0 0 8px; }
  .landing-subtitle { font-size: 14px; color: rgba(31,33,36,0.6); margin: 0 0 22px; line-height: 1.7; }
  .landing-brand-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(85,88,92,0.1); border: 1px solid rgba(85,88,92,0.25); color: #55585c; font-size: 12px; padding: 6px 12px; border-radius: 20px; margin-bottom: 24px; }

  .agent-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 4px; }
  .stage-group { width: 100%; margin-top: 18px; }
  .stage-group:first-of-type { margin-top: 6px; }
  .stage-group-title { font-size: 12.5px; font-weight: 800; color: #55585c; margin-bottom: 8px; text-align: right; }
  .stage-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 18px; }
  @media (max-width: 480px) { .stage-cards { grid-template-columns: 1fr; } }
  .stage-card {
    background: #eceded; border: 1px solid rgba(85,88,92,0.25); border-radius: 16px;
    padding: 18px 16px; text-align: center; cursor: pointer; transition: all 0.2s ease;
  }
  .stage-card:hover { border-color: #55585c; background: #e6e7e9; transform: translateY(-2px); }
  .stage-card-icon { font-size: 26px; display: block; margin-bottom: 8px; }
  .stage-card-title { font-weight: 800; font-size: 14px; margin-bottom: 4px; }
  .stage-card-desc { font-size: 11.5px; color: rgba(31,33,36,0.5); line-height: 1.6; }
  .stage-detail { width: 100%; margin-top: 12px; }
  .stage-back-btn {
    background: none; border: none; color: #55585c; font-size: 12.5px; font-weight: 700;
    cursor: pointer; padding: 4px 0; margin-bottom: 14px; display: block;
  }
  @media (max-width: 480px) { .agent-cards { grid-template-columns: 1fr; } }
  .agent-card {
    background: #eceded; border: 1px solid rgba(31,33,36,0.1); border-radius: 12px;
    padding: 14px; text-align: right; cursor: pointer; transition: border-color 0.2s, background 0.2s;
  }
  .agent-card:hover { border-color: #55585c; background: #e6e7e9; }
  .agent-card .agent-icon { font-size: 20px; margin-bottom: 6px; display: block; }
  .agent-card .agent-name { font-weight: 800; font-size: 13.5px; margin-bottom: 4px; }
  .agent-card .agent-desc { font-size: 11.5px; color: rgba(31,33,36,0.5); line-height: 1.6; }

  .crm-form { background: #eceded; border: 1px solid rgba(31,33,36,0.1); border-radius: 12px; padding: 14px; margin-bottom: 18px; }
  .crm-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 480px) { .crm-form-grid { grid-template-columns: 1fr; } }
  .crm-form input, .crm-form select, .crm-form textarea { width: 100%; background: #f2f3f4; border: 1px solid rgba(31,33,36,0.12); border-radius: 8px; color: #1f2124; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 13px; padding: 9px 11px; }
  .crm-add-btn { background: #55585c; color: #ffffff; border: none; border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 13px; cursor: pointer; }

  .crm-table-wrap { overflow-x: auto; }
  .crm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .crm-table th, .crm-table td { border: 1px solid rgba(31,33,36,0.1); padding: 9px 10px; text-align: right; white-space: nowrap; }
  .crm-table th { background: rgba(51,53,58,0.12); color: #6b6e72; font-weight: 700; }
  .crm-table tr:nth-child(even) td { background: rgba(31,33,36,0.02); }
  .crm-del { background: transparent; border: none; color: rgba(31,33,36,0.4); cursor: pointer; font-size: 13px; }
  .crm-del:hover { color: #e08080; }
  .crm-empty { font-size: 13px; color: rgba(31,33,36,0.45); padding: 20px 0; text-align: center; }
  .crm-status { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .crm-status.new { background: rgba(85,88,92,0.15); color: #55585c; }
  .crm-status.contacted { background: rgba(51,53,58,0.15); color: #6b6e72; }
  .crm-status.qualified { background: rgba(90,92,96,0.15); color: #55585c; }
  .crm-status.customer { background: rgba(85,88,92,0.25); color: #55585c; }
  .crm-status.lost { background: rgba(200,80,80,0.15); color: #e08080; }

  .messages { display: flex; flex-direction: column; gap: 12px; max-width: 720px; width: 100%; margin: 0 auto; padding-bottom: 8px; }

  .bubble { max-width: 85%; padding: 12px 16px; border-radius: 14px; font-size: 14.5px; line-height: 1.85; white-space: pre-wrap; }
  .bubble.assistant { align-self: flex-start; background: #f2f3f4; border: 1px solid rgba(31,33,36,0.08); border-start-start-radius: 4px; }
  .bubble.user { align-self: flex-end; background: linear-gradient(135deg, #3a3c3f, #2a2c2e); color: #ffffff; border-start-end-radius: 4px; }
  .bubble-image { max-width: 220px; border-radius: 10px; display: block; margin-bottom: 8px; }

  .md-content { display: flex; flex-direction: column; gap: 10px; }
  .md-p { margin: 0; }
  .md-heading { font-weight: 700; font-size: 15px; color: #6b6e72; margin-top: 2px; }
  .md-list { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 5px; }
  .md-table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 2px 0; }
  .md-table th, .md-table td { border: 1px solid rgba(31,33,36,0.14); padding: 7px 10px; text-align: right; }
  .md-table th { background: rgba(51,53,58,0.14); color: #6b6e72; font-weight: 700; }
  .md-table tr:nth-child(even) td { background: rgba(31,33,36,0.03); }

  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 14px 16px; background: #f2f3f4; border-radius: 14px; border-start-start-radius: 4px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: #2a2c2e; animation: bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .footer-area { flex-shrink: 0; padding: 10px 16px 16px; max-width: 720px; width: 100%; margin: 0 auto; }

  .image-preview { position: relative; display: inline-flex; width: fit-content; margin-bottom: 8px; }
  .image-preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(31,33,36,0.15); }
  .remove-image { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; border-radius: 50%; background: #f2f3f4; border: 1px solid rgba(31,33,36,0.25); color: #1f2124; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; font-size: 12px; line-height: 1; }

  label.attach { width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px; background: #f2f3f4; border: 1px solid rgba(31,33,36,0.12); color: rgba(31,33,36,0.75); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.2s; font-size: 18px; }
  label.attach:hover { border-color: #55585c; color: #55585c; }

  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; background: #f2f3f4; border: 1px solid rgba(31,33,36,0.12); border-radius: 12px; color: #1f2124; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 14.5px; padding: 12px 14px; min-height: 46px; max-height: 120px; outline: none; }
  textarea:focus { border-color: #2a2c2e; }

  button.send { background: #55585c; color: #ffffff; border: none; border-radius: 12px; padding: 0 18px; height: 46px; font-family: 'Inter', 'Tajawal', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }
  button.send:focus-visible { outline: 2px solid #1f2124; outline-offset: 2px; }

  .error-banner { background: rgba(200,80,80,0.12); border: 1px solid rgba(200,80,80,0.3); color: #f0b8b8; font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; max-width: 720px; margin-inline: auto; }

  /* ---------- Panels (Brand Profile / Calendar) ---------- */
  .panel-wrap { max-width: 720px; width: 100%; margin: 0 auto; padding-bottom: 24px; }
  .panel-header { margin-bottom: 18px; }
  .panel-header h2 { margin: 0 0 4px; font-size: 19px; font-weight: 900; }
  .panel-header p { margin: 0; font-size: 13px; color: rgba(31,33,36,0.55); line-height: 1.7; }

  .field-group { margin-bottom: 16px; }
  .field-group label { display: block; font-size: 12.5px; color: rgba(31,33,36,0.6); margin-bottom: 6px; font-weight: 700; }
  .field-group input, .field-group textarea, .field-group select {
    width: 100%; background: #f2f3f4; border: 1px solid rgba(31,33,36,0.12); border-radius: 10px;
    color: #1f2124; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 14px; padding: 11px 13px; outline: none;
  }
  .field-group input:focus, .field-group textarea:focus, .field-group select:focus { border-color: #2a2c2e; }
  .field-group textarea { resize: vertical; min-height: 70px; }

  .panel-save-btn {
    background: #55585c; color: #ffffff; border: none; border-radius: 10px; padding: 12px 22px;
    font-family: 'Inter', 'Tajawal', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .panel-save-note { display: inline-block; margin-inline-start: 12px; font-size: 12.5px; color: #55585c; }

  .cal-form { background: #eceded; border: 1px solid rgba(31,33,36,0.1); border-radius: 12px; padding: 14px; margin-bottom: 18px; }
  .cal-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 480px) { .cal-form-grid { grid-template-columns: 1fr; } }
  .cal-form input, .cal-form select { width: 100%; background: #f2f3f4; border: 1px solid rgba(31,33,36,0.12); border-radius: 8px; color: #1f2124; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 13px; padding: 9px 11px; }
  .cal-add-btn { background: #55585c; color: #ffffff; border: none; border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 13px; cursor: pointer; }

  .cal-table-wrap { overflow-x: auto; }
  .cal-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cal-table th, .cal-table td { border: 1px solid rgba(31,33,36,0.1); padding: 9px 10px; text-align: right; white-space: nowrap; }
  .cal-table th { background: rgba(51,53,58,0.12); color: #6b6e72; font-weight: 700; }
  .cal-table tr:nth-child(even) td { background: rgba(31,33,36,0.02); }
  .cal-del { background: transparent; border: none; color: rgba(31,33,36,0.4); cursor: pointer; font-size: 13px; }
  .cal-del:hover { color: #e08080; }
  .cal-empty { font-size: 13px; color: rgba(31,33,36,0.45); padding: 20px 0; text-align: center; }

  @media (max-width: 720px) {
    .sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; width: 270px; }
    .sidebar.closed { margin-inline-start: -270px; }
  }
</style>
</head>

القواعد الصارمة (متفاوضيش عليها):
1. القاعدة الصفرية (Zero-Hallucination): ممنوع منعًا باتًا اختراع أسعار، أرقام، نسب تحويل، شهادات عملاء، إحصائيات، نتائج حملات سابقة، أو قدرات منتج مش مذكورة. لو المعلومة مش موجودة صراحة من العميل أو من سياق المحادثة، قولي بوضوح "المعلومة دي مش متاحة" أو اسأليها — متخترعيهاش أبدًا.
2. الفرق بين "مسودة" و"منفذ فعليًا": إنتِ مش متصلة بأي منصة إعلانات أو إيميل أو نشر حقيقي. أي محتوى أو خطة بتطلعيها هي "جاهزة للمراجعة والموافقة" مش "منفذة" أو "منشورة". ممنوع تقولي "تم النشر" أو "الحملة شغالة" لأن ده مش بيحصل فعليًا من عندك.
3. ممنوع الكليشيهات: "في عالمنا المتسارع"، "لا تدع الفرصة تفوتك"، "الرائد في مجاله"، "حلول مبتكرة وفريدة من نوعها"، "نحن الخيار الأفضل".
4. الأسلوب: عامية مصرية راقية ومبسطة، مع مصطلحات بزنس إنجليزية واضحة عند الحاجة. مباشرة بدون حشو أو مقدمات زي "أكيد!" أو "تمام، هساعدك بكل سرور" — ابدئي بالنتيجة المفيدة على طول.
5. الإيجاز هو الافتراضي: ردودك زي استراتيجي تسويق كبير بيرد على زميله، مش زي تقرير طويل. للأسئلة البسيطة، جاوبي في 2-5 جمل بس. متكرريش نفس المعلومة، ومتشرحيش تفاصيل مش لازمة. التفصيل والجداول والأقسام الكبيرة بس لما الموضوع فعلاً يستاهل (تحليل، استراتيجية، أو لما العميل يطلب تفصيل أكتر صراحة).

طريقة التفكير (مش كل خطوة لازم تظهر في كل رد — اختاري المناسب حسب الطلب):
افهمي الطلب والسياق ← حلّلي البيانات المتاحة (بيانات البراند، محادثات سابقة من وكلاء تانيين) ← شخّصي المشكلة الحقيقية جوه الطلب ← اقترحي إجراء محدد بأولوية وأثر متوقع ← ابني خطة أو محتوى لو مطلوب.

اختيار شكل الرد (مهم جدًا — متستخدميش نفس القالب لكل حاجة، وخليه مختصر قد الإمكان):
- سؤال بسيط → إجابة مباشرة في 2-5 جمل، من غير جداول أو تقسيمات.
- تحليل/تشخيص → 4 أجزاء مختصرة بس: خلاصة (MARKO DIAGNOSIS، سطر أو اتنين) ← أهم الملاحظات (Key Findings، 3-5 نقط بحد أقصى) ← التوصية (Recommendation، توصية واحدة أو اتنين بالأولوية 🔴🟠🟢) ← الخطوة الجاية (Next Action، سطر واحد محدد). من غير حشو أو تكرار.
- تحليل منافسين → قارني بس لما المقارنة تفيد الفهم؛ جدول صغير أو نقط، مش جدول ضخم لأكتر من 4-5 منافسين. اقفلي بخلاصة قصيرة.
- استراتيجية → الهدف / الجمهور / التموضع / العرض / الرسالة الأساسية / القنوات / الـ Funnel / KPIs، كل بند سطر أو اتنين بس مش فقرة.
- محتوى → كل قطعة محتوى منفصلة (Hook / النص / CTA / المنصة المقترحة)، مش كل حاجة في جدول واحد ضخم. النص نفسه (البوست/الإعلان) يبقى كامل وجاهز للنشر، لكن أي شرح حواليه يبقى مختصر.

- تحليل أداء/أرقام → استخدمي أرقام حقيقية بس لو العميل دّاهالك؛ لو مفيش أرقام حقيقية وضّحي إنه افتراضي أو اطلبيها. اشرحي بإيجاز "إيه اللي حصل" و"ليه على الأرجح" و"إيه الخطوة الجاية"، ومَيزّي بوضوح بين حاجة "مؤكدة" وحاجة "استنتاج" وحاجة "مش معروفة".

- درجة تشبع السوق: سوق جديد يكفيه وعد بسيط؛ سوق مشبع محتاج آلية/دليل مختلف أو زاوية هوية وتجربة جديدة بدل الوعد العام المكرر.
- مَيزّي دايمًا: الميزة (Feature) ← الفايدة الوظيفية ← الفايدة العاطفية ← نتيجة العمل النهائية (Business Outcome). الأولوية للفايدة مش لسرد المميزات.

- الـ CTA لازم يكون واضح ومحدد وسهل — إجراء واحد واضح، مش أكتر من حاجة في نفس الوقت.

- خليكي مختصرة كقاعدة عامة، وموسّعة بس لما الموضوع فعلاً يستاهل (تحليل معمّق) أو لما العميل يطلب تفصيل صراحة.
- لو فيه بيانات تاريخية حقيقية اتقالت قبل كده في المحادثة، قارني بيها؛ لو مفيش، متقوليش إن فيه مقارنة سابقة.
- في أي رد فيه توصيات، رتبيها بالأولوية ومتحطيش أكتر من توصية "عالية الأولوية" واحدة أو اتنين في نفس الوقت.
- لو بيانات البراند ناقصة وطلب العميل محتاجها، اسأليها الأول قبل ما تكملي.

لو المستخدم بعت صورة (تصميم، سكرين شوت، منتج، منافس...)، حللها من ناحية تسويقية بإيجاز بناءً على سياق الكلام.

النص الجاهز للنشر (بوستات/إعلانات) لازم يبقى كامل ومكتمل مهما كان الرد حواليه مختصر — الإيجاز يبقى في الشرح مش في المحتوى المطلوب نفسه.

محرك الرغبة (Desire Engine): ماتخترعيش رغبة مصطنعة — اربطي المنتج برغبة إنسانية موجودة أصلاً (فلوس، وقت، صحة، أمان، مكانة اجتماعية، راحة، انتماء، حرية، تحكم، إنجاز، حماية العيلة). اختاري الأقرب لسياق العميل وجمهوره.

هيكل الإقناع لما يكون مطلوب نص طويل (بوست تفصيلي/إعلان مطول/لاندنج): هوك يلفت الانتباه ← فضول أو مشكلة ← الحل ← الفايدة ← دليل (لو موجود) ← القيمة مقابل السعر ← كسر مقاومة الشك (ضمان/سهولة الرجوع لو موجود فعلاً) ← عرض ← CTA واحد واضح. ملهاش داعي تتفرض على محتوى قصير (كابشن، ستوري).

مكتبة المبادئ الإبداعية: لما تحتاجي زاوية إبداعية مختلفة، استلهمي من مبادئ الإعلانات الكبيرة (مش نسخها):
- تحويل نقطة ضعف لسبب شرا (زي Think Small لفولكس فاجن)
- ربط البراند بهوية/فعل (زي Just Do It)
- تموضع البراند كهوية مش منتج (زي Think Different)
- إيجاد توتر إنساني أعمق ورا المنتج (زي Real Beauty)
- تحويل حقيقة إنسانية بسيطة لمنصة محتوى متكررة (زي Snickers "You're not you when you're hungry")
- كسر توقعات الفئة (زي Old Spice)
- تخصيص تجربة المنتج (زي Share a Coke)
- تحويل البراند لتجربة/حدث (زي Red Bull Stratos)
هاتي المبدأ، حوّليه لزاوية تناسب البراند والجمهور اللي قدامك، ومتقوليش أو تلمّحيش إنه نفس الحملة.

عقلية الاختبار: لو العميل بيسأل عن نسخة أفضل أو A/B تيست، فكري بصيغة فرضية: "الفرضية إن X هيتفوق على Y لإن كذا" + إيه المتغير الأساسي (Hook/Offer/CTA) اللي بيتغير بين النسختين، مش مجرد تغيير صفة.

مهم: كل المبادئ دي أدوات تفكير مساعدة — استخدميها بس لما تخدم رد العميل فعلاً، ومترجعيش لقالب واحد ثابت لكل حاجة.`;

function InlineText({ text }) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g).filter((p) => p !== "");
  return parts.map((part, i) =>
    part.startsWith("**") && part.endsWith("**") ? (
      <strong key={i}>{part.slice(2, -2)}</strong>
    ) : (
      <React.Fragment key={i}>{part}</React.Fragment>
    )
  );
}

function MarkdownContent({ content }) {
  const lines = content.split("\n");
  const blocks = [];
  let i = 0;
  const isTable = (l) => l.trim().startsWith("|");
  const isUl = (l) => /^\s*[-*]\s+/.test(l);
  const isOl = (l) => /^\s*\d+\.\s+/.test(l);
  const isHeading = (l) => /^#{1,3}\s+/.test(l);

  while (i < lines.length) {
    const line = lines[i];
    if (isTable(line)) {
      const tableLines = [];
      while (i < lines.length && isTable(lines[i])) { tableLines.push(lines[i]); i++; }
      blocks.push({ type: "table", lines: tableLines });
    } else if (isUl(line)) {
      const items = [];
      while (i < lines.length && isUl(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
      blocks.push({ type: "ul", items });
    } else if (isOl(line)) {
      const items = [];
      while (i < lines.length && isOl(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++; }
      blocks.push({ type: "ol", items });
    } else if (isHeading(line)) {
      blocks.push({ type: "heading", text: line.replace(/^#{1,3}\s+/, "") });
      i++;
    } else if (line.trim() === "") {
      i++;
    } else {
      const paraLines = [];
      while (i < lines.length && lines[i].trim() !== "" && !isTable(lines[i]) && !isUl(lines[i]) && !isOl(lines[i]) && !isHeading(lines[i])) {
        paraLines.push(lines[i]); i++;
      }
      blocks.push({ type: "p", text: paraLines.join(" ") });
    }
  }

  return (
    <div className="md-content">
      {blocks.map((b, idx) => {
        if (b.type === "table") {
          const rows = b.lines
            .map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()))
            .filter((r) => !r.every((c) => /^:?-+:?$/.test(c)));
          const [header, ...body] = rows;
          if (!header) return null;
          return (
            <table className="md-table" key={idx}>
              <thead><tr>{header.map((h, hi) => <th key={hi}><InlineText text={h} /></th>)}</tr></thead>
              <tbody>{body.map((r, ri) => <tr key={ri}>{r.map((c, ci) => <td key={ci}><InlineText text={c} /></td>)}</tr>)}</tbody>
            </table>
          );
        }
        if (b.type === "ul") return <ul className="md-list" key={idx}>{b.items.map((it, ii) => <li key={ii}><InlineText text={it} /></li>)}</ul>;
        if (b.type === "ol") return <ol className="md-list" key={idx}>{b.items.map((it, ii) => <li key={ii}><InlineText text={it} /></li>)}</ol>;
        if (b.type === "heading") return <div className="md-heading" key={idx}><InlineText text={b.text} /></div>;
        return <p className="md-p" key={idx}><InlineText text={b.text} /></p>;
      })}
    </div>
  );
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

function makeTitle(text) {
  const clean = (text || "").trim().replace(/\s+/g, " ");
  if (!clean) return "محادثة جديدة";
  return clean.length > 32 ? clean.slice(0, 32) + "…" : clean;
}

function sharedAgentContextToText(conversations, excludeId) {
  const others = conversations.filter((c) => c.id !== excludeId && c.messages && c.messages.length > 0);
  if (others.length === 0) return "";
  const recent = others.slice(0, 5);
  const blocks = recent.map((c) => {
    const lastAssistant = [...c.messages].reverse().find((m) => m.role === "assistant");
    if (!lastAssistant) return null;
    const snippet = lastAssistant.content.trim().replace(/\s+/g, " ").slice(0, 260);
    return `• محادثة "${c.title}": ${snippet}${lastAssistant.content.length > 260 ? "…" : ""}`;
  }).filter(Boolean);
  if (blocks.length === 0) return "";
  return `\n\nمخرجات سابقة من وكلاء/محادثات تانية لنفس العميل (استخدميها كسياق، وابنِ عليها بدل ما تكرري نفس التحليل من الصفر لو مناسب):\n${blocks.join("\n")}`;
}

    ["الميزة التنافسية (USP)", b.usp],

    ["ملاحظات إضافية عن أسلوب البراند", b.notes],
  ].filter(([, v]) => v && v.trim());
  if (rows.length === 0) return "";
  const lines = rows.map(([k, v]) => `- ${k}: ${v}`).join("\n");
  return `\n\nبيانات البراند المحفوظة لهذا العميل (متاحة بالفعل، لا تطلبيها من المستخدم تاني إلا لو غيّرت رأيها):\n${lines}`;
}

        </div>
        <input placeholder="ملاحظات (اختياري)" value={notes} onChange={(e) => setNotes(e.target.value)} style={{ marginBottom: "10px" }} />

      {sorted.length === 0 ? (
        <div className="crm-empty">مفيش عملاء مسجلين لسه. ضيفي أول عميل من الفورم فوق.</div>

        <div className="crm-table-wrap">
          <table className="crm-table">
            <thead>
              <tr><th>الاسم</th><th>التواصل</th><th>الحالة</th><th>المصدر</th><th>تاريخ الإضافة</th><th></th></tr>
            </thead>
            <tbody>
              {sorted.map((it) => (
                <tr key={it.id}>
                  <td>{it.name}</td>
                  <td>{it.contact || "—"}</td>
                  <td><span className={`crm-status ${it.status}`}>{statusLabel(it.status)}</span></td>
                  <td>{it.source || "—"}</td>
                  <td>{it.addedAt}</td>
                  <td><button className="crm-del" onClick={() => onDelete(it.id)}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function AuthGate({ onEnter }) {
  const [mode, setMode] = useState("signup"); // signup | login
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  function usersMap() {
    return loadJSON("marko_users_v1", {});
  }

  function submit(e) {
    e.preventDefault();
    setError("");
    const cleanEmail = email.trim().toLowerCase();
    if (!cleanEmail || !password) { setError("املي الإيميل والباسورد."); return; }
    if (mode === "signup" && !name.trim()) { setError("اكتبي اسمك."); return; }

    const users = usersMap();

    if (mode === "signup") {
      if (users[cleanEmail]) { setError("الإيميل ده مسجل قبل كده — سجّلي دخول بدل كده."); return; }
      if (password.length < 4) { setError("الباسورد لازم يبقى 4 حروف/أرقام على الأقل."); return; }
      users[cleanEmail] = { name: name.trim(), password };
      saveJSON("marko_users_v1", users);
      const profile = { name: name.trim(), email: cleanEmail };
      saveJSON(USER_KEY, profile);
      onEnter(profile);
    } else {
      const record = users[cleanEmail];
      if (!record || record.password !== password) { setError("الإيميل أو الباسورد غلط."); return; }
      const profile = { name: record.name, email: cleanEmail };
      saveJSON(USER_KEY, profile);
      onEnter(profile);
    }
  }

  return (
    <div className="auth-shell" dir="rtl">
      <div className="auth-card">
        <div className="auth-logo-row">
          <img src={LOGO_SRC} alt="Marko" />
          <div className="auth-title">MARKO</div>
        </div>
        <p className="auth-sub">نظام تشغيل تسويقي ذكي — استراتيجي، كوبي رايتر، ومحلل بيانات في مكان واحد.</p>

        <div className="auth-tabs">
          <div className={"auth-tab" + (mode === "signup" ? " active" : "")} onClick={() => { setMode("signup"); setError(""); }}>حساب جديد</div>
          <div className={"auth-tab" + (mode === "login" ? " active" : "")} onClick={() => { setMode("login"); setError(""); }}>تسجيل دخول</div>
        </div>

        <form onSubmit={submit}>
          {mode === "signup" && (
            <div className="auth-field">
              <label>الاسم</label>
              <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="اسمك" autoFocus />
            </div>
          )}
          <div className="auth-field">
            <label>الإيميل</label>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@brand.com" />
          </div>
          <div className="auth-field">
            <label>الباسورد</label>
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" />
          </div>
          {error && <div className="auth-error">{error}</div>}
          <button type="submit" className="auth-submit">{mode === "signup" ? "ابدئي مع ماركو" : "ادخلي"}</button>
        </form>

        <p className="auth-note">حسابك متخزّن على المتصفح ده بس، مش على سيرفر مركزي — عشان كده لو مسحتِ بيانات المتصفح أو غيّرتِ جهاز، هتحتاجي تسجّلي تاني.</p>
      </div>
    </div>
  );
}

/* ---------------- Overview / Command Center ---------------- */
function computeBrandCompleteness(brand) {
  if (!brand) return 0;
  const fields = ["name", "industry", "priceTier", "usp", "audience", "platforms"];
  const filled = fields.filter((f) => brand[f] && brand[f].trim()).length;
  return Math.round((filled / fields.length) * 100);
}

function OverviewPanel({ brand, calendar, crm, conversations, onGoBrand, onGoCalendar, onGoCrm, onStartAgent, currentUser }) {
  const completeness = computeBrandCompleteness(brand);
  const today = new Date();
  const upcoming = calendar
    .filter((it) => new Date(it.date) >= new Date(today.toDateString()))
    .sort((a, b) => (a.date > b.date ? 1 : -1));
  const overdue = calendar.filter((it) => new Date(it.date) < new Date(today.toDateString()));
  const leadsByStatus = CRM_STATUSES.reduce((acc, s) => {
    acc[s.value] = crm.filter((c) => c.status === s.value).length;
    return acc;
  }, {});
  const staleLeads = crm.filter((c) => c.status === "new" || c.status === "contacted");

  // Build "MARKO's attention" from real signals — never invented numbers.
  const attentionItems = [];
  if (!brand) {
    attentionItems.push({
      title: "ملف البراند لسه فاضي",
      body: "ماركو مش هيقدر يديكي توصيات دقيقة من غير ما يعرف براندك. ابدئي بملف البراند الأول — ده أهم خطوة قبل أي حاجة تانية.",
      cta: "اعملي ملف البراند",
      action: onGoBrand,
    });
  } else if (completeness < 100) {
    attentionItems.push({
      title: `ملف البراند مكتمل ${completeness}% بس`,
      body: "فيه بيانات ناقصة (زي الميزة التنافسية أو الجمهور المستهدف) — كل ما البيانات تزيد، كل ما توصيات ماركو تبقى أدق.",
      cta: "كمّلي ملف البراند",
      action: onGoBrand,
    });
  }
  if (overdue.length > 0) {
    attentionItems.push({
      title: `فيه ${overdue.length} عنصر في تقويم المحتوى فات موعده`,
      body: "محتوى مجدول من زمان ولسه متعمّلش أو متراجعش — يستاهل تتأكدي منه قبل ما يتراكم.",
      cta: "افتحي التقويم",
      action: onGoCalendar,
    });
  }
  if (staleLeads.length >= 3) {
    attentionItems.push({
      title: `${staleLeads.length} ليدز لسه في مرحلة "جديد/تم التواصل"`,
      body: "ليدز واقفة من غير متابعة بتفقد قيمتها بمرور الوقت — يستاهل ماركو يساعدك تحددي أولوية المتابعة.",
      cta: "افتحي العملاء",
      action: onGoCrm,
    });

  const totalConvs = conversations.filter((c) => c.messages && c.messages.length > 0).length;

  return (
    <div className="ov-wrap">
      <h1 className="ov-greeting">أهلا{currentUser?.name ? `، ${currentUser.name}` : ""} 👋</h1>
      <p className="ov-sub">ده مركز القيادة بتاع ماركو — كل حاجة شغالة عليها فريقك التسويقي في مكان واحد.</p>

      <div className="ov-kpi-grid">
        <div className="ov-kpi-card">
          <div className="ov-kpi-label">اكتمال البيزنس برين</div>
          <div className="ov-kpi-value">{completeness}%</div>
          <div className="ov-kpi-sub">{brand ? brand.name || "بلا اسم" : "لسه معملتيش الملف"}</div>
        </div>
        <div className="ov-kpi-card">
          <div className="ov-kpi-label">محتوى مجدول (قادم)</div>
          <div className="ov-kpi-value">{upcoming.length}</div>
          <div className="ov-kpi-sub">{overdue.length > 0 ? `⚠ ${overdue.length} فات موعده` : "كله في وقته"}</div>

  );
}

function MarkoApp() {
  const [currentUser] = useState(() => loadJSON(USER_KEY, null));
  const [conversations, setConversations] = useState(() => loadJSON(CONV_KEY, []));
  const [brand, setBrand] = useState(() => loadJSON(BRAND_KEY, null));
  const [calendar, setCalendar] = useState(() => loadJSON(CAL_KEY, []));
  const [crm, setCrm] = useState(() => loadJSON(CRM_KEY, []));
  const [activeId, setActiveId] = useState(null);
  const [view, setView] = useState("overview"); // overview | chat | brand | calendar | crm
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [pendingImage, setPendingImage] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [selectedStage, setSelectedStage] = useState(null);
  const [askOpen, setAskOpen] = useState(false);
  const [askText, setAskText] = useState("");
  const contentRef = useRef(null);

  function submitAsk() {
    if (!askText.trim() || loading) return;
    setActiveId(null);
    setView("chat");
    setAskOpen(false);
    const text = askText;
    setAskText("");
    sendMessage(text);
  }

  useEffect(() => { saveJSON(CONV_KEY, conversations); }, [conversations]);
  useEffect(() => { saveJSON(BRAND_KEY, brand); }, [brand]);
  useEffect(() => { saveJSON(CAL_KEY, calendar); }, [calendar]);
  useEffect(() => { saveJSON(CRM_KEY, crm); }, [crm]);

  useEffect(() => {
    contentRef.current?.scrollTo({ top: contentRef.current.scrollHeight, behavior: "smooth" });
  }, [activeId, loading, conversations, view]);

  const activeConv = conversations.find((c) => c.id === activeId) || null;
  const messages = activeConv ? activeConv.messages : [];
  const isEmptyChat = !activeConv || messages.length === 0;
  const hasBrand = !!(brand && brand.name && brand.name.trim());

  function goToOverview() { setView("overview"); setSidebarOpen(false); }
  function goToChat() { setView("chat"); setSidebarOpen(false); }
  function goToBrand() { setView("brand"); setSidebarOpen(false); }
  function goToCalendar() { setView("calendar"); setSidebarOpen(false); }
  function goToCrm() { setView("crm"); setSidebarOpen(false); }

  function startNewChat() {
    setActiveId(null);
    setInput("");
    setPendingImage(null);
    setErrorMsg("");
    setView("chat");
    setSidebarOpen(false);
    setSelectedStage(null);
  }

  function selectConversation(id) {
    setActiveId(id);
    setErrorMsg("");
    setView("chat");
    setSidebarOpen(false);
  }

  function deleteConversation(id, e) {
    e.stopPropagation();
    setConversations((prev) => prev.filter((c) => c.id !== id));
    if (activeId === id) setActiveId(null);
  }

  function handleFileSelect(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(",")[1];
      setPendingImage({ dataUrl, mediaType: file.type, base64 });
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function removePendingImage() { setPendingImage(null); }

  function exportConversation() {
    if (!activeConv) return;
    const lines = activeConv.messages.map((m) => {
      const who = m.role === "assistant" ? "ماركو" : "أنا";
      const imgNote = m.image ? "[صورة مرفقة]\n" : "";
      return `${who}:\n${imgNote}${m.content}\n`;
    });
    const text = lines.join("\n---\n\n");
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `marko-${stamp}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function addCalendarItem(item) { setCalendar((prev) => [...prev, item]); }
  function deleteCalendarItem(id) { setCalendar((prev) => prev.filter((c) => c.id !== id)); }
  function addCrmItem(item) { setCrm((prev) => [...prev, item]); }
  function deleteCrmItem(id) { setCrm((prev) => prev.filter((c) => c.id !== id)); }

  function startAgentChat(agent) {
    setActiveId(null);
    setPendingImage(null);
    setErrorMsg("");
    setView("chat");
    setSidebarOpen(false);
    setSelectedStage(null);
    setInput(agent.prompt);
  }

  async function sendMessage(overrideText) {
    const textToSend = overrideText !== undefined ? overrideText : input;
    if ((!textToSend.trim() && !pendingImage) || loading) return;
    setErrorMsg("");

    const userMsg = {
      role: "user",
      content: textToSend.trim(),
      image: pendingImage?.dataUrl || null,
      mediaType: pendingImage?.mediaType || null,
      base64: pendingImage?.base64 || null,
    };

    let convId = activeId;
    let historyForApi;

    if (!convId) {
      convId = Date.now();
      const newConv = { id: convId, title: makeTitle(userMsg.content), messages: [userMsg] };
      setConversations((prev) => [newConv, ...prev]);
      setActiveId(convId);
      historyForApi = [userMsg];
    } else {
      setConversations((prev) =>
        prev.map((c) => (c.id === convId ? { ...c, messages: [...c.messages, userMsg] } : c))
      );
      const current = conversations.find((c) => c.id === convId);
      historyForApi = current ? [...current.messages, userMsg] : [userMsg];
    }

    setInput("");
    setPendingImage(null);
    setLoading(true);

    const effectiveSystemPrompt =
      BASE_SYSTEM_PROMPT + brandProfileToText(brand) + sharedAgentContextToText(conversations, convId);

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: controller.signal,
        body: JSON.stringify({
          system: effectiveSystemPrompt,
          messages: historyForApi.map((m) => {
            if (m.role === "user" && m.image) {
              return {
                role: "user",
                content: [
                  { type: "image", source: { type: "base64", media_type: m.mediaType, data: m.base64 } },
                  { type: "text", text: m.content || "حللي الصورة دي من ناحية تسويقية وقوليلي ملاحظاتك." },
                ],
              };
            }
            return { role: m.role, content: m.content };
          }),
        }),
      });
      clearTimeout(timeoutId);
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || data.error || "حصل خطأ في السيرفر");
      }
      const text = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("\n");
      const assistantMsg = { role: "assistant", content: text || "معلش، مش قادر أرد دلوقتي. جرّبي تاني." };
      setConversations((prev) =>
        prev.map((c) => (c.id === convId ? { ...c, messages: [...c.messages, assistantMsg] } : c))
      );
    } catch (e) {
      const msg = e.name === "AbortError" ? "الرد اتأخر أكتر من اللازم. جرّبي تبعتي تاني." : (e.message || "حصل خطأ في الاتصال بالسيرفر.");
      setErrorMsg(msg);
    } finally {
      setLoading(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  const AttachInput = (
    <label className="attach" title="إرفاق صورة">
      📎
      <input type="file" accept="image/*" onChange={handleFileSelect} style={{ display: "none" }} />
    </label>
  );

  const ImagePreview = pendingImage && (
    <div className="image-preview">
      <img src={pendingImage.dataUrl} alt="معاينة" />
      <button className="remove-image" onClick={removePendingImage}>✕</button>
    </div>
  );

  const sortedConvs = [...conversations].sort((a, b) => b.id - a.id);

  return (
    <div className="app-shell" dir="rtl">
      <div className={`sidebar-overlay ${sidebarOpen ? "show" : ""}`} onClick={() => setSidebarOpen(false)} />

      <div className={`sidebar ${sidebarOpen ? "" : "closed"}`}>
        <div className="sidebar-header">
          <img src={LOGO_SRC} alt="Marko" className="sidebar-logo" />
          <span className="sidebar-title">ماركو — MARKO</span>
        </div>

        <div className="sidebar-tabs">
          <div className={`sidebar-tab ${view === "overview" ? "active" : ""}`} onClick={goToOverview}>🏠 Overview</div>
          <div className={`sidebar-tab ${view === "brand" ? "active" : ""}`} onClick={goToBrand}>🧠 البيزنس برين</div>
        </div>
        <div className="sidebar-tabs" style={{ paddingTop: 0 }}>
          <div className={`sidebar-tab ${view === "calendar" ? "active" : ""}`} onClick={goToCalendar}>✍️ المحتوى</div>
          <div className={`sidebar-tab ${view === "crm" ? "active" : ""}`} onClick={goToCrm}>📢 العملاء</div>
        </div>
        <div className="sidebar-tabs" style={{ paddingTop: 0 }}>
          <div className={`sidebar-tab ${view === "chat" ? "active" : ""}`} onClick={goToChat}>💬 المحادثات</div>
        </div>

        {view === "chat" ? (
          <React.Fragment>
            <button className="new-chat-btn" onClick={startNewChat}>+ محادثة جديدة</button>
            <div className="conv-list">
              {sortedConvs.length === 0 && <div className="sidebar-empty">مفيش محادثات محفوظة لسه. ابدئي أول محادثة وهتلاقيها هنا.</div>}
              {sortedConvs.map((c) => (
                <div key={c.id} className={`conv-item ${c.id === activeId ? "active" : ""}`} onClick={() => selectConversation(c.id)}>
                  <span className="label">{c.title}</span>
                  <button className="conv-delete" onClick={(e) => deleteConversation(c.id, e)} title="حذف">✕</button>
                </div>
              ))}
            </div>
          </React.Fragment>
        ) : (
          <div className={`brand-status ${hasBrand ? "set" : ""}`}>
            {hasBrand ? `✓ ملف براند "${brand.name}" محفوظ ومتاح لماركو` : "لسه معملتيش ملف براند. احفظيه من التاب ده."}
          </div>
        )}

        <div style={{ marginTop: "auto", padding: "10px 14px", borderTop: "1px solid rgba(31,33,36,0.08)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: "12px", color: "rgba(31,33,36,0.55)" }}>{currentUser?.name || ""}</span>
          <button
            onClick={() => { localStorage.removeItem(USER_KEY); window.location.reload(); }}
            style={{ background: "transparent", border: "none", color: "rgba(31,33,36,0.4)", fontSize: "11.5px", cursor: "pointer" }}
          >
            تسجيل خروج
          </button>
        </div>
      </div>

      <div className="main-area">
        <div className="topbar">
          <button className="hamburger" onClick={() => setSidebarOpen((v) => !v)} title="القائمة">☰</button>
          <img src={LOGO_SRC} alt="Marko" className="logo-img" />
          <div className="title-block">
            <h1>ماركو</h1>
            <p>MARKETING OPERATING SYSTEM</p>
          </div>
          {view === "chat" && activeConv && messages.length > 0 && (
            <button className="save-btn" onClick={exportConversation} title="تحميل المحادثة">💾 حفظ</button>
          )}
        </div>


        <div className="content-area" ref={contentRef}>
          {view === "overview" ? (
            <OverviewPanel
              brand={brand}
              calendar={calendar}
              crm={crm}
              conversations={conversations}
              currentUser={currentUser}
              onGoBrand={goToBrand}
              onGoCalendar={goToCalendar}
              onGoCrm={goToCrm}
              onStartAgent={startAgentChat}
            />
          ) : view === "brand" ? (
            <BrandPanel brand={brand} onSave={setBrand} />
          ) : view === "calendar" ? (
            <CalendarPanel items={calendar} onAdd={addCalendarItem} onDelete={deleteCalendarItem} />
          ) : view === "crm" ? (
            <CrmPanel items={crm} onAdd={addCrmItem} onDelete={deleteCrmItem} />
          ) : isEmptyChat ? (
            <div className="landing">
              <img src={LOGO_SRC} alt="Marko" className="landing-logo" />
              <h1 className="landing-title">أهلا، أنا Marko</h1>
              <p className="landing-subtitle">المستشار التنفيذي التسويقي بتاعك. قولي أقدر أساعدك إزاي؟</p>
              {hasBrand && <div className="landing-brand-chip">🏷️ شغالة على براند: {brand.name}</div>}

              {!selectedStage ? (
                <div className="stage-cards">
                  {STAGE_GROUPS.map((g) => (
                    <div key={g.id} className="stage-card" onClick={() => setSelectedStage(g.id)}>
                      <span className="stage-card-icon">{g.icon}</span>
                      <div className="stage-card-title">{g.title}</div>
                      <div className="stage-card-desc">{g.desc}</div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="stage-detail">
                  <button className="stage-back-btn" onClick={() => setSelectedStage(null)}>
                    → كل المراحل
                  </button>
                  <div className="stage-group-title">
                    {STAGE_GROUPS.find((g) => g.id === selectedStage)?.icon}{" "}
                    {STAGE_GROUPS.find((g) => g.id === selectedStage)?.title}
                  </div>
                  <div className="agent-cards">
                    {AGENTS.filter((a) => a.stage === selectedStage).map((a) => (
                      <div key={a.id} className="agent-card" onClick={() => startAgentChat(a)}>
                        <span className="agent-icon">{a.icon}</span>
                        <div className="agent-name">{a.name}</div>
                        <div className="agent-desc">{a.desc}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div className="messages">
              {messages.map((m, i) => (
                <div key={i} className={`bubble ${m.role}`}>
                  {m.image && <img src={m.image} alt="مرفق" className="bubble-image" />}
                  {m.role === "assistant" ? <MarkdownContent content={m.content} /> : m.content}
                </div>
              ))}
              {loading && <div className="typing"><span></span><span></span><span></span></div>}
            </div>
          )}
        </div>

        {view === "chat" && (
          <div className="footer-area">
            {errorMsg && <div className="error-banner">{errorMsg}</div>}
            {ImagePreview}
            <div className="input-row">
              {AttachInput}
              <textarea
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder={isEmptyChat ? "اكتبي بيانات البراند أو سؤالك هنا..." : "اكتبي ردك هنا..."}
                autoFocus
              />
              <button className="send" onClick={() => sendMessage()} disabled={loading}>{loading ? "..." : "➤"}</button>
            </div>
          </div>
        )}
      </div>

      {view !== "chat" && (
        <React.Fragment>
          {askOpen && (
            <div className="ask-marko-panel">
              <h4>✨ اسألي ماركو</h4>
              <textarea
                value={askText}
                onChange={(e) => setAskText(e.target.value)}
                placeholder="مثلاً: ليه المبيعات نازلة الأسبوع ده؟"
                autoFocus
                onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAsk(); } }}
              />
              <div className="row">
                <button className="ov-btn" style={{ flex: 1 }} onClick={submitAsk}>ابعتي</button>
                <button className="ov-btn ghost" onClick={() => setAskOpen(false)}>إلغاء</button>
              </div>
            </div>
          )}
          <button className="ask-marko-fab" onClick={() => setAskOpen((v) => !v)}>✨ اسألي ماركو</button>
        </React.Fragment>
      )}
    </div>
  );
}

function Root() {
  const [user, setUser] = useState(() => loadJSON(USER_KEY, null));
  if (!user) return <AuthGate onEnter={setUser} />;
  return <MarkoApp />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
