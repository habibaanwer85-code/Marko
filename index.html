<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  body {
    font-family: 'Inter', 'Tajawal', sans-serif;
    background: #F7F7F8;
    background-image: radial-gradient(circle at 85% -10%, rgba(108,77,255,0.13), transparent 45%);
    color: #18181B;
  }
  #root { height: 100vh; height: 100dvh; }

  .app-shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 270px;
    flex-shrink: 0;
    background: #ffffff;
    border-inline-start: 1px solid rgba(24,24,27,0.08);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    transition: margin-inline-start 0.25s ease;
    position: relative;
    z-index: 20;
  }
  .sidebar.closed { margin-inline-start: -270px; }
  .sidebar-header { padding: 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(24,24,27,0.08); }
  .sidebar-logo { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; }
  .sidebar-title { font-weight: 800; font-size: 14.5px; }

  .sidebar-tabs { display: flex; gap: 4px; padding: 10px 10px 4px; }
  .sidebar-tab {
    flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; cursor: pointer;
    font-size: 11.5px; font-weight: 700; color: rgba(24,24,27,0.55);
    border: 1px solid transparent; transition: all 0.15s;
  }
  .sidebar-tab.active { background: rgba(108,77,255,0.14); color: #6C4DFF; border-color: rgba(108,77,255,0.3); }
  .sidebar-tab:hover:not(.active) { background: rgba(24,24,27,0.05); }

  .new-chat-btn {
    margin: 10px 14px 6px;
    display: flex; align-items: center; gap: 8px;
    background: #EFEBFF; border: 1px solid rgba(108,77,255,0.3); color: #18181B;
    border-radius: 10px; padding: 10px 12px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 13.5px; font-weight: 700;
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
  }
  .new-chat-btn:hover { border-color: #6C4DFF; background: #F1EEFF; }
  .conv-list { flex: 1; overflow-y: auto; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 3px; }
  .conv-list::-webkit-scrollbar { width: 4px; }
  .conv-list::-webkit-scrollbar-thumb { background: rgba(24,24,27,0.12); border-radius: 4px; }
  .conv-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 10px; border-radius: 9px; cursor: pointer;
    font-size: 13px; color: rgba(24,24,27,0.75);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background 0.15s;
  }
  .conv-item:hover { background: rgba(24,24,27,0.06); }
  .conv-item.active { background: rgba(108,77,255,0.14); color: #18181B; }
  .conv-item span.label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-delete { opacity: 0; flex-shrink: 0; background: transparent; border: none; color: rgba(24,24,27,0.5); cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .conv-item:hover .conv-delete { opacity: 1; }
  .conv-delete:hover { color: #EF4444; }
  .sidebar-empty { padding: 16px 14px; font-size: 12.5px; color: rgba(24,24,27,0.4); line-height: 1.7; }

  .sidebar-nav-btn {
    margin: 10px 14px 6px; display: flex; align-items: center; gap: 8px;
    background: transparent; border: 1px solid rgba(24,24,27,0.12); color: rgba(24,24,27,0.8);
    border-radius: 10px; padding: 10px 12px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: border-color 0.2s;
  }
  .sidebar-nav-btn:hover { border-color: #6C4DFF; color: #6C4DFF; }
  .brand-status { padding: 10px 14px; font-size: 11.5px; color: rgba(24,24,27,0.45); line-height: 1.7; }
  .brand-status.set { color: #6C4DFF; }

  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 15; display: none; }
  .sidebar-overlay.show { display: block; }

  /* ---------- Auth / Welcome gate ---------- */
  .auth-shell {
    height: 100vh; height: 100dvh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden;
  }
  .auth-shell::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 15% 10%, rgba(108,77,255,0.16), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(108,77,255,0.10), transparent 50%);
    pointer-events: none;
  }
  .auth-card {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    background: #ffffff; border: 1px solid rgba(24,24,27,0.09);
    border-radius: 20px; padding: 34px 30px 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .auth-logo-row { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 6px; }
  .auth-logo-row img { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; }
  .auth-title { font-size: 21px; font-weight: 900; text-align: center; margin: 4px 0 2px; }
  .auth-sub { font-size: 12.5px; color: rgba(24,24,27,0.5); text-align: center; margin: 0 0 22px; line-height: 1.7; }
  .auth-tabs { display: flex; gap: 6px; background: #F7F7F8; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .auth-tab { flex: 1; text-align: center; padding: 9px 4px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 700; color: rgba(24,24,27,0.5); transition: all 0.15s; }
  .auth-tab.active { background: #EFEBFF; color: #6C4DFF; }
  .auth-field { margin-bottom: 13px; }
  .auth-field label { display: block; font-size: 11.5px; color: rgba(24,24,27,0.55); margin-bottom: 6px; font-weight: 700; }
  .auth-field input {
    width: 100%; background: #F7F7F8; border: 1px solid rgba(24,24,27,0.12); color: #18181B;
    border-radius: 10px; padding: 11px 13px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 14px;
    outline: none; transition: border-color 0.15s;
  }
  .auth-field input:focus { border-color: #6C4DFF; }
  .auth-error { color: #EF4444; font-size: 12px; margin: 2px 0 12px; text-align: center; }
  .auth-submit {
    width: 100%; background: linear-gradient(135deg, #6C4DFF, #5135D9); color: #ffffff; border: none;
    border-radius: 11px; padding: 13px; font-family: 'Inter', 'Tajawal', sans-serif; font-size: 14.5px; font-weight: 900;
    cursor: pointer; margin-top: 6px; transition: filter 0.15s;
  }
  .auth-submit:hover { filter: brightness(1.08); }

القواعد الصارمة (متفاوضيش عليها):
1. القاعدة الصفرية (Zero-Hallucination): ممنوع منعًا باتًا اختراع أسعار، أرقام، نسب تحويل، شهادات عملاء، إحصائيات، نتائج حملات سابقة، أو قدرات منتج مش مذكورة. لو المعلومة مش موجودة صراحة من العميل أو من سياق المحادثة، قولي بوضوح "المعلومة دي مش متاحة" أو اسأليها — متخترعيهاش أبدًا.
2. الفرق بين "مسودة" و"منفذ فعليًا": إنتِ مش متصلة بأي منصة إعلانات أو إيميل أو نشر حقيقي. أي محتوى أو خطة بتطلعيها هي "جاهزة للمراجعة والموافقة" مش "منفذة" أو "منشورة". ممنوع تقولي "تم النشر" أو "الحملة شغالة" لأن ده مش بيحصل فعليًا من عندك.

5. الإيجاز هو الافتراضي: ردودك زي استراتيجي تسويق كبير بيرد على زميله، مش زي تقرير طويل. للأسئلة البسيطة، جاوبي في 2-5 جمل بس. متكرريش نفس المعلومة، ومتشرحيش تفاصيل مش لازمة. التفصيل والجداول والأقسام الكبيرة بس لما الموضوع فعلاً يستاهل (تحليل، استراتيجية، أو لما العميل يطلب تفصيل أكتر صراحة).

طريقة التفكير (مش كل خطوة لازم تظهر في كل رد — اختاري المناسب حسب الطلب):
افهمي الطلب والسياق ← حلّلي البيانات المتاحة (بيانات البراند، محادثات سابقة من وكلاء تانيين) ← شخّصي المشكلة الحقيقية جوه الطلب ← اقترحي إجراء محدد بأولوية وأثر متوقع ← ابني خطة أو محتوى لو مطلوب.

اختيار شكل الرد (مهم جدًا — متستخدميش نفس القالب لكل حاجة، وخليه مختصر قد الإمكان):

- تحليل/تشخيص → 4 أجزاء مختصرة بس: خلاصة (MARKO DIAGNOSIS، سطر أو اتنين) ← أهم الملاحظات (Key Findings، 3-5 نقط بحد أقصى) ← التوصية (Recommendation، توصية واحدة أو اتنين بالأولوية 🔴🟠🟢) ← الخطوة الجاية (Next Action، سطر واحد محدد). من غير حشو أو تكرار.

- مَيزّي دايمًا: الميزة (Feature) ← الفايدة الوظيفية ← الفايدة العاطفية ← نتيجة العمل النهائية (Business Outcome). الأولوية للفايدة مش لسرد المميزات.
- لو فيه وعد يحتاج تبرير، وضّحي "الآلية" (ليه هيشتغل) مش بس الوعد، وبس لو الآلية مبنية على قدرة حقيقية للمنتج مش مخترعة.
- الدليل (شهادات/أرقام) يتحط بس لو موجود فعلاً من العميل؛ لو مش موجود اكتبي "⚠️ محتاجة دليل هنا" بدل ما تخترعيه.
- الـ CTA لازم يكون واضح ومحدد وسهل — إجراء واحد واضح، مش أكتر من حاجة في نفس الوقت.

قواعد عامة تانية:
- خليكي مختصرة كقاعدة عامة، وموسّعة بس لما الموضوع فعلاً يستاهل (تحليل معمّق) أو لما العميل يطلب تفصيل صراحة.
- لو فيه بيانات تاريخية حقيقية اتقالت قبل كده في المحادثة، قارني بيها؛ لو مفيش، متقوليش إن فيه مقارنة سابقة.
- في أي رد فيه توصيات، رتبيها بالأولوية ومتحطيش أكتر من توصية "عالية الأولوية" واحدة أو اتنين في نفس الوقت.
- لو بيانات البراند ناقصة وطلب العميل محتاجها، اسأليها الأول قبل ما تكملي.

لو المستخدم بعت صورة (تصميم، سكرين شوت، منتج، منافس...)، حللها من ناحية تسويقية بإيجاز بناءً على سياق الكلام.

النص الجاهز للنشر (بوستات/إعلانات) لازم يبقى كامل ومكتمل مهما كان الرد حواليه مختصر — الإيجاز يبقى في الشرح مش في المحتوى المطلوب نفسه.

محرك الرغبة (Desire Engine): ماتخترعيش رغبة مصطنعة — اربطي المنتج برغبة إنسانية موجودة أصلاً (فلوس، وقت، صحة، أمان، مكانة اجتماعية، راحة، انتماء، حرية، تحكم، إنجاز، حماية العيلة). اختاري الأقرب لسياق العميل وجمهوره.

هيكل الإقناع لما يكون مطلوب نص طويل (بوست تفصيلي/إعلان مطول/لاندنج): هوك يلفت الانتباه ← فضول أو مشكلة ← الحل ← الفايدة ← دليل (لو موجود) ← القيمة مقابل السعر ← كسر مقاومة الشك (ضمان/سهولة الرجوع لو موجود فعلاً) ← عرض ← CTA واحد واضح. ملهاش داعي تتفرض على محتوى قصير (كابشن، ستوري).

مكتبة المبادئ الإبداعية: لما تحتاجي زاوية إبداعية مختلفة، استلهمي من مبادئ الإعلانات الكبيرة (مش نسخها):
- تحويل نقطة ضعف لسبب شرا (زي Think Small لفولكس فاجن)
- ربط البراند بهوية/فعل (زي Just Do It)
- تموضع البراند كهوية مش منتج (زي Think Different)
- إيجاد توتر إنساني أعمق ورا المنتج (زي Real Beauty)
- تحويل حقيقة إنسانية بسيطة لمنصة محتوى متكررة (زي Snickers "You're not you when you're hungry")
- كسر توقعات الفئة (زي Old Spice)
- تخصيص تجربة المنتج (زي Share a Coke)
- تحويل البراند لتجربة/حدث (زي Red Bull Stratos)
هاتي المبدأ، حوّليه لزاوية تناسب البراند والجمهور اللي قدامك، ومتقوليش أو تلمّحيش إنه نفس الحملة.

عقلية الاختبار: لو العميل بيسأل عن نسخة أفضل أو A/B تيست، فكري بصيغة فرضية: "الفرضية إن X هيتفوق على Y لإن كذا" + إيه المتغير الأساسي (Hook/Offer/CTA) اللي بيتغير بين النسختين، مش مجرد تغيير صفة.

مهم: كل المبادئ دي أدوات تفكير مساعدة — استخدميها بس لما تخدم رد العميل فعلاً، ومترجعيش لقالب واحد ثابت لكل حاجة.`;

function InlineText({ text }) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g).filter((p) => p !== "");
  return parts.map((part, i) =>
    part.startsWith("**") && part.endsWith("**") ? (
      <strong key={i}>{part.slice(2, -2)}</strong>
    ) : (
      <React.Fragment key={i}>{part}</React.Fragment>
    )
  );
}

function MarkdownContent({ content }) {
  const lines = content.split("\n");
  const blocks = [];
  let i = 0;
  const isTable = (l) => l.trim().startsWith("|");
  const isUl = (l) => /^\s*[-*]\s+/.test(l);
  const isOl = (l) => /^\s*\d+\.\s+/.test(l);
  const isHeading = (l) => /^#{1,3}\s+/.test(l);

  while (i < lines.length) {
    const line = lines[i];
    if (isTable(line)) {
      const tableLines = [];
      while (i < lines.length && isTable(lines[i])) { tableLines.push(lines[i]); i++; }
      blocks.push({ type: "table", lines: tableLines });
    } else if (isUl(line)) {
      const items = [];
      while (i < lines.length && isUl(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
      blocks.push({ type: "ul", items });
    } else if (isOl(line)) {
      const items = [];
      while (i < lines.length && isOl(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++; }
      blocks.push({ type: "ol", items });
    } else if (isHeading(line)) {
      blocks.push({ type: "heading", text: line.replace(/^#{1,3}\s+/, "") });
      i++;
    } else if (line.trim() === "") {
      i++;
    } else {
      const paraLines = [];
      while (i < lines.length && lines[i].trim() !== "" && !isTable(lines[i]) && !isUl(lines[i]) && !isOl(lines[i]) && !isHeading(lines[i])) {
        paraLines.push(lines[i]); i++;
      }
      blocks.push({ type: "p", text: paraLines.join(" ") });
    }
  }

  return (
    <div className="md-content">
      {blocks.map((b, idx) => {
        if (b.type === "table") {
          const rows = b.lines
            .map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()))
            .filter((r) => !r.every((c) => /^:?-+:?$/.test(c)));
          const [header, ...body] = rows;
          if (!header) return null;
          return (
            <table className="md-table" key={idx}>
              <thead><tr>{header.map((h, hi) => <th key={hi}><InlineText text={h} /></th>)}</tr></thead>
              <tbody>{body.map((r, ri) => <tr key={ri}>{r.map((c, ci) => <td key={ci}><InlineText text={c} /></td>)}</tr>)}</tbody>
            </table>
          );
        }
        if (b.type === "ul") return <ul className="md-list" key={idx}>{b.items.map((it, ii) => <li key={ii}><InlineText text={it} /></li>)}</ul>;
        if (b.type === "ol") return <ol className="md-list" key={idx}>{b.items.map((it, ii) => <li key={ii}><InlineText text={it} /></li>)}</ol>;
        if (b.type === "heading") return <div className="md-heading" key={idx}><InlineText text={b.text} /></div>;
        return <p className="md-p" key={idx}><InlineText text={b.text} /></p>;
      })}
    </div>
  );
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

function makeTitle(text) {
  const clean = (text || "").trim().replace(/\s+/g, " ");
  if (!clean) return "محادثة جديدة";
  return clean.length > 32 ? clean.slice(0, 32) + "…" : clean;
}

function sharedAgentContextToText(conversations, excludeId) {
  const others = conversations.filter((c) => c.id !== excludeId && c.messages && c.messages.length > 0);
  if (others.length === 0) return "";
  const recent = others.slice(0, 5);
  const blocks = recent.map((c) => {
    const lastAssistant = [...c.messages].reverse().find((m) => m.role === "assistant");
    if (!lastAssistant) return null;
    const snippet = lastAssistant.content.trim().replace(/\s+/g, " ").slice(0, 260);
    return `• محادثة "${c.title}": ${snippet}${lastAssistant.content.length > 260 ? "…" : ""}`;
  }).filter(Boolean);
  if (blocks.length === 0) return "";
  return `\n\nمخرجات سابقة من وكلاء/محادثات تانية لنفس العميل (استخدميها كسياق، وابنِ عليها بدل ما تكرري نفس التحليل من الصفر لو مناسب):\n${blocks.join("\n")}`;
}

}

function AuthGate({ onEnter }) {
  const [mode, setMode] = useState("signup"); // signup | login
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [lang, setLang] = useState(() => loadJSON("marko_lang_v1", "ar"));
  const dir = lang === "en" ? "ltr" : "rtl";
  function t(ar, en) { return lang === "en" ? en : ar; }

  useEffect(() => { saveJSON("marko_lang_v1", lang); document.documentElement.lang = lang; document.documentElement.dir = dir; }, [lang, dir]);

  function usersMap() {
    return loadJSON("marko_users_v1", {});
  }

  function submit(e) {
    e.preventDefault();
    setError("");
    const cleanEmail = email.trim().toLowerCase();
    if (!cleanEmail || !password) { setError(t("املي الإيميل والباسورد.", "Fill in your email and password.")); return; }
    if (mode === "signup" && !name.trim()) { setError(t("اكتبي اسمك.", "Enter your name.")); return; }

    const users = usersMap();

    if (mode === "signup") {
      if (users[cleanEmail]) { setError(t("الإيميل ده مسجل قبل كده — سجّلي دخول بدل كده.", "This email is already registered — log in instead.")); return; }
      if (password.length < 4) { setError(t("الباسورد لازم يبقى 4 حروف/أرقام على الأقل.", "Password must be at least 4 characters.")); return; }
      users[cleanEmail] = { name: name.trim(), password };
      saveJSON("marko_users_v1", users);
      const profile = { name: name.trim(), email: cleanEmail };
      saveJSON(USER_KEY, profile);
      onEnter(profile);
    } else {
      const record = users[cleanEmail];
      if (!record || record.password !== password) { setError(t("الإيميل أو الباسورد غلط.", "Incorrect email or password.")); return; }
      const profile = { name: record.name, email: cleanEmail };
      saveJSON(USER_KEY, profile);
      onEnter(profile);
    }
  }

  return (
    <div className="auth-shell" dir={dir}>
      <div className="lang-switch auth-lang-switch">
        <button className={lang === "ar" ? "active" : ""} onClick={() => setLang("ar")}>عربي</button>
        <button className={lang === "en" ? "active" : ""} onClick={() => setLang("en")}>EN</button>
      </div>
      <div className="auth-card">
        <div className="auth-logo-row">
          <img src={LOGO_SRC} alt="Marko" />
          <div className="auth-title">MARKO</div>
        </div>
        <p className="auth-sub">{t("نظام تشغيل تسويقي ذكي — استراتيجي، كوبي رايتر، ومحلل بيانات في مكان واحد.", "Marketing Intelligence System — strategist, copywriter, and data analyst in one place.")}</p>

        <div className="auth-tabs">
          <div className={"auth-tab" + (mode === "signup" ? " active" : "")} onClick={() => { setMode("signup"); setError(""); }}>{t("حساب جديد", "Sign up")}</div>
          <div className={"auth-tab" + (mode === "login" ? " active" : "")} onClick={() => { setMode("login"); setError(""); }}>{t("تسجيل دخول", "Log in")}</div>
        </div>

        <form onSubmit={submit}>
          {mode === "signup" && (
            <div className="auth-field">
              <label>{t("الاسم", "Name")}</label>
              <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder={t("اسمك", "Your name")} autoFocus />
            </div>
          )}
          <div className="auth-field">
            <label>{t("الإيميل", "Email")}</label>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@brand.com" />
          </div>
          <div className="auth-field">
            <label>{t("الباسورد", "Password")}</label>
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" />
          </div>
          {error && <div className="auth-error">{error}</div>}
          <button type="submit" className="auth-submit">{mode === "signup" ? t("ابدئي مع ماركو", "Start with MARKO") : t("ادخلي", "Log in")}</button>
        </form>

        <p className="auth-note">{t("حسابك متخزّن على المتصفح ده بس، مش على سيرفر مركزي — عشان كده لو مسحتِ بيانات المتصفح أو غيّرتِ جهاز، هتحتاجي تسجّلي تاني.", "Your account is stored on this browser only, not on a central server — so clearing browser data or switching devices means signing up again.")}</p>
      </div>
    </div>
  );
}

/* ---------------- Overview / Command Center ---------------- */
function computeBrandCompleteness(brand) {
  if (!brand) return 0;
  const fields = ["name", "industry", "priceTier", "usp", "audience", "platforms"];
  const filled = fields.filter((f) => brand[f] && brand[f].trim()).length;
  return Math.round((filled / fields.length) * 100);
}

function OverviewPanel({ brand, calendar, crm, conversations, onGoBrand, onGoCalendar, onGoCrm, onStartAgent, currentUser, t, activity }) {
  const completeness = computeBrandCompleteness(brand);
  const today = new Date();
  const upcoming = calendar
    .filter((it) => new Date(it.date) >= new Date(today.toDateString()))
    .sort((a, b) => (a.date > b.date ? 1 : -1));
  const overdue = calendar.filter((it) => new Date(it.date) < new Date(today.toDateString()));
  const leadsByStatus = CRM_STATUSES.reduce((acc, s) => {
    acc[s.value] = crm.filter((c) => c.status === s.value).length;
    return acc;
  }, {});
  const staleLeads = crm.filter((c) => c.status === "new" || c.status === "contacted");

  // Build "MARKO's attention" from real signals — never invented numbers.
  const attentionItems = [];
  if (!brand) {
    attentionItems.push({
      title: t("ملف البراند لسه فاضي", "The Business Brain is still empty"),
      body: t("ماركو مش هيقدر يديكي توصيات دقيقة من غير ما يعرف براندك. ابدئي بملف البراند الأول — ده أهم خطوة قبل أي حاجة تانية.", "MARKO can't give you precise recommendations without knowing your brand. Start with the brand profile first — it's the most important step before anything else."),
      cta: t("اعملي ملف البراند", "Build the Brain"),
      action: onGoBrand,
    });
  } else if (completeness < 100) {
    attentionItems.push({
      title: t(`ملف البراند مكتمل ${completeness}% بس`, `Business Brain is only ${completeness}% complete`),
      body: t("فيه بيانات ناقصة (زي الميزة التنافسية أو الجمهور المستهدف) — كل ما البيانات تزيد، كل ما توصيات ماركو تبقى أدق.", "Some data is missing (like your USP or target audience) — the more complete it is, the sharper MARKO's recommendations get."),
      cta: t("كمّلي ملف البراند", "Complete the Brain"),
      action: onGoBrand,
    });
  }
  if (overdue.length > 0) {
    attentionItems.push({
      title: t(`فيه ${overdue.length} عنصر في تقويم المحتوى فات موعده`, `${overdue.length} content item(s) are past due`),
      body: t("محتوى مجدول من زمان ولسه متعمّلش أو متراجعش — يستاهل تتأكدي منه قبل ما يتراكم.", "Scheduled content that hasn't been done or reviewed yet — worth checking before it piles up."),
      cta: t("افتحي التقويم", "Open content"),
      action: onGoCalendar,
    });
  }
  if (staleLeads.length >= 3) {
    attentionItems.push({
      title: t(`${staleLeads.length} ليدز لسه في مرحلة "جديد/تم التواصل"`, `${staleLeads.length} leads still sit at "New/Contacted"`),
      body: t("ليدز واقفة من غير متابعة بتفقد قيمتها بمرور الوقت — يستاهل ماركو يساعدك تحددي أولوية المتابعة.", "Leads without follow-up lose value over time — MARKO can help you prioritize who to follow up with."),
      cta: t("افتحي العملاء", "Open clients"),
      action: onGoCrm,
    });
  }

  const totalConvs = conversations.filter((c) => c.messages && c.messages.length > 0).length;

  function timeAgo(iso) {
    const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (diffMin < 1) return t("دلوقتي", "just now");
    if (diffMin < 60) return t(`من ${diffMin} دقيقة`, `${diffMin}m ago`);
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return t(`من ${diffH} ساعة`, `${diffH}h ago`);
    const diffD = Math.round(diffH / 24);
    return t(`من ${diffD} يوم`, `${diffD}d ago`);
  }

  return (
    <div className="ov-wrap">
      <div className="ov-status-pill">● {t("ماركو شغال", "MARKO ACTIVE")}</div>
      <h1 className="ov-greeting">{t(`أهلا${currentUser?.name ? `، ${currentUser.name}` : ""} 👋`, `Hi${currentUser?.name ? `, ${currentUser.name}` : ""} 👋`)}</h1>
      <p className="ov-sub">{t("ده مركز القيادة بتاع ماركو — كل حاجة شغالة عليها فريقك التسويقي في مكان واحد.", "This is MARKO's command center — everything your marketing runs on, in one place.")}</p>

      <div className="ov-kpi-grid">
        <div className="ov-kpi-card">
          <div className="ov-kpi-label">{t("اكتمال العقل المركزي", "Business Brain")}</div>
          <div className="ov-kpi-value">{completeness}%</div>
          <div className="ov-kpi-sub">{brand ? brand.name || t("بلا اسم", "Unnamed") : t("لسه معملتيش الملف", "Not built yet")}</div>
        </div>
        <div className="ov-kpi-card">
          <div className="ov-kpi-label">{t("محتوى مجدول (قادم)", "Scheduled content")}</div>
          <div className="ov-kpi-value">{upcoming.length}</div>
          <div className="ov-kpi-sub">{overdue.length > 0 ? t(`⚠ ${overdue.length} فات موعده`, `⚠ ${overdue.length} overdue`) : t("كله في وقته", "All on track")}</div>
        </div>
        <div className="ov-kpi-card">
          <div className="ov-kpi-label">{t("عملاء/ليدز مسجلين", "Clients / leads")}</div>
          <div className="ov-kpi-value">{crm.length}</div>
          <div className="ov-kpi-sub">{t(`${leadsByStatus.customer || 0} اتحولوا لعملاء فعليين`, `${leadsByStatus.customer || 0} converted to customers`)}</div>
        </div>
        <div className="ov-kpi-card">
          <div className="ov-kpi-label">{t("محادثات مع ماركو", "Conversations")}</div>
          <div className="ov-kpi-value">{totalConvs}</div>
          <div className="ov-kpi-sub">{t("إجمالي المحادثات المحفوظة", "Total saved conversations")}</div>
        </div>
      </div>

      {attentionItems.length > 0 && (
        <div className="ov-attn">
          <div className="ov-attn-title">⚠ {t("محتاج انتباهك", "MARKO'S ATTENTION")}</div>
          {attentionItems.map((it, i) => (
            <div key={i} style={{ marginBottom: i < attentionItems.length - 1 ? "14px" : 0 }}>
              <div className="ov-attn-body"><strong>{it.title}</strong><br />{it.body}</div>
              <div className="ov-attn-actions">
                <button className="ov-btn" onClick={it.action}>{it.cta}</button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="ov-section-title">{t("ابدئي شغل مع ماركو", "Start working with MARKO")}</div>
      <div className="ov-quick-grid">
        {AGENTS.slice(0, 8).map((a) => (
          <div key={a.id} className="ov-quick-card" onClick={() => onStartAgent(a)}>
            <span className="ov-quick-icon">{a.icon}</span>
            <div className="ov-quick-title">{t(a.name, a.nameEn || a.name)}</div>
          </div>
        ))}
      </div>

      {activity.length > 0 && (
        <React.Fragment>
          <div className="ov-section-title" style={{ marginTop: "26px" }}>{t("نشاط ماركو", "MARKO ACTIVITY")}</div>
          <div className="ov-timeline">
            {activity.slice(0, 8).map((ev) => (
              <div key={ev.id} className="ov-timeline-item">
                <span className="ov-timeline-dot" />
                <div>
                  <div className="ov-timeline-text">{ev.text}</div>
                  <div className="ov-timeline-time">{timeAgo(ev.at)}</div>
                </div>
              </div>
            ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

  const [autopilot, setAutopilot] = useState(() => loadJSON("marko_autopilot_v1", "prepare")); // recommend | prepare | execute
  const [activity, setActivity] = useState(() => loadJSON("marko_activity_v1", []));
  const [conversations, setConversations] = useState(() => loadJSON(CONV_KEY, []));
  const [brand, setBrand] = useState(() => loadJSON(BRAND_KEY, null));
  const [calendar, setCalendar] = useState(() => loadJSON(CAL_KEY, []));
  const [crm, setCrm] = useState(() => loadJSON(CRM_KEY, []));
  const [activeId, setActiveId] = useState(null);
  const [view, setView] = useState("overview"); // overview | chat | brand | calendar | crm
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [pendingImage, setPendingImage] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [selectedStage, setSelectedStage] = useState(null);
  const [askOpen, setAskOpen] = useState(false);
  const [askText, setAskText] = useState("");
  const contentRef = useRef(null);
  const dir = lang === "en" ? "ltr" : "rtl";

  function t(ar, en) { return lang === "en" ? en : ar; }

  useEffect(() => { saveJSON("marko_lang_v1", lang); document.documentElement.lang = lang; document.documentElement.dir = dir; }, [lang, dir]);
  useEffect(() => { saveJSON("marko_autopilot_v1", autopilot); }, [autopilot]);
  useEffect(() => { saveJSON("marko_activity_v1", activity); }, [activity]);

  function logActivity(text) {
    setActivity((prev) => [{ id: Date.now(), text, at: new Date().toISOString() }, ...prev].slice(0, 30));
  }

  function submitAsk() {
    if (!askText.trim() || loading) return;
    navigate("chat", null);
    setAskOpen(false);
    const text = askText;
    setAskText("");
    sendMessage(text);
  }

  useEffect(() => { saveJSON(CONV_KEY, conversations); }, [conversations]);
  useEffect(() => { saveJSON(BRAND_KEY, brand); }, [brand]);
  useEffect(() => { saveJSON(CAL_KEY, calendar); }, [calendar]);
  useEffect(() => { saveJSON(CRM_KEY, crm); }, [crm]);

  // ---- Back-button / history integration ----
  // Without this, the app has only ONE browser-history entry, so the very
  // first press of the phone/browser back button exits the whole app
  // instead of stepping back through views (chat -> overview, etc.).
  useEffect(() => {
    window.history.replaceState({ view: "overview", activeId: null }, "", window.location.href);
    function onPopState(e) {
      const st = e.state || { view: "overview", activeId: null };
      setView(st.view || "overview");
      setActiveId(st.activeId ?? null);
      setSidebarOpen(false);
      setSelectedStage(null);
    }
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, []);

  function navigate(nextView, nextActiveId) {
    setView(nextView);
    setActiveId(nextActiveId !== undefined ? nextActiveId : null);
    window.history.pushState({ view: nextView, activeId: nextActiveId !== undefined ? nextActiveId : null }, "", window.location.href);
  }

  useEffect(() => {
    contentRef.current?.scrollTo({ top: contentRef.current.scrollHeight, behavior: "smooth" });
  }, [activeId, loading, conversations, view]);

  const activeConv = conversations.find((c) => c.id === activeId) || null;
  const messages = activeConv ? activeConv.messages : [];
  const isEmptyChat = !activeConv || messages.length === 0;
  const hasBrand = !!(brand && brand.name && brand.name.trim());

  function goToOverview() { navigate("overview", null); setSidebarOpen(false); }
  function goToChat() { navigate("chat", activeId); setSidebarOpen(false); }
  function goToBrand() { navigate("brand", null); setSidebarOpen(false); }
  function goToCalendar() { navigate("calendar", null); setSidebarOpen(false); }
  function goToCrm() { navigate("crm", null); setSidebarOpen(false); }

  function startNewChat() {
    navigate("chat", null);
    setInput("");
    setPendingImage(null);
    setErrorMsg("");
    setSidebarOpen(false);
    setSelectedStage(null);
  }

  function selectConversation(id) {
    navigate("chat", id);
    setErrorMsg("");
    setSidebarOpen(false);
  }

  function deleteConversation(id, e) {
    e.stopPropagation();
    setConversations((prev) => prev.filter((c) => c.id !== id));
    if (activeId === id) setActiveId(null);
  }

  function handleFileSelect(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(",")[1];
      setPendingImage({ dataUrl, mediaType: file.type, base64 });
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function removePendingImage() { setPendingImage(null); }

  function exportConversation() {
    if (!activeConv) return;
    const lines = activeConv.messages.map((m) => {
      const who = m.role === "assistant" ? "ماركو" : "أنا";
      const imgNote = m.image ? "[صورة مرفقة]\n" : "";
      return `${who}:\n${imgNote}${m.content}\n`;
    });
    const text = lines.join("\n---\n\n");
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `marko-${stamp}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function addCalendarItem(item) {
    setCalendar((prev) => [...prev, item]);
    logActivity(t(`اتضاف محتوى جديد للتقويم: "${item.topic || ""}"`, `New content added to the calendar: "${item.topic || ""}"`));
  }
  function deleteCalendarItem(id) { setCalendar((prev) => prev.filter((c) => c.id !== id)); }
  function addCrmItem(item) {
    setCrm((prev) => [...prev, item]);
    logActivity(t(`اتضاف عميل/ليد جديد: "${item.name || ""}"`, `New client/lead added: "${item.name || ""}"`));
  }
  function deleteCrmItem(id) { setCrm((prev) => prev.filter((c) => c.id !== id)); }

  function saveBrandWithLog(b) {
    setBrand(b);
    logActivity(t(`اتحدّث ملف البراند "${b?.name || ""}"`, `Business Brain profile "${b?.name || ""}" updated`));
  }

  function startAgentChat(agent) {
    navigate("chat", null);
    setPendingImage(null);
    setErrorMsg("");
    setSidebarOpen(false);
    setSelectedStage(null);
    setInput(agent.prompt);
    logActivity(t(`بدأتي محادثة مع "${agent.name}"`, `Started a conversation with "${agent.nameEn || agent.name}"`));
  }

  async function sendMessage(overrideText) {
    const textToSend = overrideText !== undefined ? overrideText : input;
    if ((!textToSend.trim() && !pendingImage) || loading) return;
    setErrorMsg("");

    const userMsg = {
      role: "user",
      content: textToSend.trim(),
      image: pendingImage?.dataUrl || null,
      mediaType: pendingImage?.mediaType || null,
      base64: pendingImage?.base64 || null,
    };

    let convId = activeId;
    let historyForApi;

    if (!convId) {
      // Guard against duplicate conversations: if a conversation already
      // exists whose first message is identical to this one and it never
      // got a reply, resume it instead of creating a new duplicate entry.
      const dup = conversations.find(
        (c) => c.messages.length === 1 && c.messages[0].role === "user" && c.messages[0].content === userMsg.content
      );
      if (dup) {
        convId = dup.id;
        setActiveId(convId);
        historyForApi = [userMsg];
      } else {
        convId = Date.now();
        const newConv = { id: convId, title: makeTitle(userMsg.content), messages: [userMsg] };
        setConversations((prev) => [newConv, ...prev]);
        setActiveId(convId);
        historyForApi = [userMsg];
      }
    } else {
      setConversations((prev) =>
        prev.map((c) => (c.id === convId ? { ...c, messages: [...c.messages, userMsg] } : c))
      );
      const current = conversations.find((c) => c.id === convId);
      historyForApi = current ? [...current.messages, userMsg] : [userMsg];
    }

    setInput("");
    setPendingImage(null);
    setLoading(true);

    const langInstruction =
      lang === "en"
        ? "\n\nIMPORTANT: The user's interface is set to English. Reply in clear, professional English (unless they explicitly write to you in Arabic in a given message, in which case match them for that message)."
        : "";
    const autopilotInstruction =
      autopilot === "recommend"
        ? t("\n\nأسلوب الرد المطلوب: قدّمي توصيات واضحة بس، من غير ما تفترضي إن أي حاجة هتتنفذ فورًا.", "\n\nResponse style: give clear recommendations only — don't assume anything will be executed immediately.")
        : autopilot === "execute"
        ? t("\n\nأسلوب الرد المطلوب: قدّمي المخرجات جاهزة للاستخدام مباشرة وبثقة (المستخدم هو اللي هينفذها فعليًا برا الموقع).", "\n\nResponse style: present outputs as ready-to-use and confident (the user will be the one to actually execute them outside the app).")
        : t("\n\nأسلوب الرد المطلوب: جهّزي المسودة وقوليلها إيه اللي محتاج موافقتها قبل التنفيذ.", "\n\nResponse style: prepare the draft and flag what needs her approval before execution.");

    const effectiveSystemPrompt =
      BASE_SYSTEM_PROMPT + brandProfileToText(brand) + sharedAgentContextToText(conversations, convId) + langInstruction + autopilotInstruction;

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: controller.signal,
        body: JSON.stringify({
          system: effectiveSystemPrompt,
          messages: historyForApi.map((m) => {
            if (m.role === "user" && m.image) {
              return {
                role: "user",
                content: [
                  { type: "image", source: { type: "base64", media_type: m.mediaType, data: m.base64 } },
                  { type: "text", text: m.content || "حللي الصورة دي من ناحية تسويقية وقوليلي ملاحظاتك." },
                ],
              };
            }
            return { role: m.role, content: m.content };
          }),
        }),
      });
      clearTimeout(timeoutId);
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || data.error || "حصل خطأ في السيرفر");
      }
      const text = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("\n");
      const assistantMsg = { role: "assistant", content: text || "معلش، مش قادر أرد دلوقتي. جرّبي تاني." };
      setConversations((prev) =>
        prev.map((c) => (c.id === convId ? { ...c, messages: [...c.messages, assistantMsg] } : c))
      );
    } catch (e) {
      const msg = e.name === "AbortError" ? "الرد اتأخر أكتر من اللازم. جرّبي تبعتي تاني." : (e.message || "حصل خطأ في الاتصال بالسيرفر.");
      setErrorMsg(msg);
    } finally {
      setLoading(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  const AttachInput = (
    <label className="attach" title={t("إرفاق صورة", "Attach image")}>
      📎
      <input type="file" accept="image/*" onChange={handleFileSelect} style={{ display: "none" }} />
    </label>
  );

  const ImagePreview = pendingImage && (
    <div className="image-preview">
      <img src={pendingImage.dataUrl} alt={t("معاينة", "Preview")} />
      <button className="remove-image" onClick={removePendingImage}>✕</button>
    </div>
  );

  const sortedConvs = [...conversations].sort((a, b) => b.id - a.id);

  return (
    <div className="app-shell" dir={dir}>
      <div className={`sidebar-overlay ${sidebarOpen ? "show" : ""}`} onClick={() => setSidebarOpen(false)} />

      <div className={`sidebar ${sidebarOpen ? "" : "closed"}`}>
        <div className="sidebar-header">
          <img src={LOGO_SRC} alt="Marko" className="sidebar-logo" />
          <span className="sidebar-title">MARKO</span>
        </div>

        <div className="sidebar-tabs">
          <div className={`sidebar-tab ${view === "overview" ? "active" : ""}`} onClick={goToOverview}>⌂ {t("القيادة", "Command")}</div>
          <div className={`sidebar-tab ${view === "brand" ? "active" : ""}`} onClick={goToBrand}>◉ {t("العقل", "Brain")}</div>
        </div>
        <div className="sidebar-tabs" style={{ paddingTop: 0 }}>
          <div className={`sidebar-tab ${view === "calendar" ? "active" : ""}`} onClick={goToCalendar}>▣ {t("المحتوى", "Content")}</div>
          <div className={`sidebar-tab ${view === "crm" ? "active" : ""}`} onClick={goToCrm}>◇ {t("العملاء", "Clients")}</div>
        </div>
        <div className="sidebar-tabs" style={{ paddingTop: 0 }}>
          <div className={`sidebar-tab ${view === "chat" ? "active" : ""}`} onClick={goToChat}>◌ {t("الذكاء", "Intelligence")}</div>
        </div>

        {view === "chat" ? (
          <React.Fragment>
            <button className="new-chat-btn" onClick={startNewChat}>+ {t("محادثة جديدة", "New conversation")}</button>
            <div className="conv-list">
              {sortedConvs.length === 0 && <div className="sidebar-empty">{t("مفيش محادثات محفوظة لسه. ابدئي أول محادثة وهتلاقيها هنا.", "No saved conversations yet. Start your first one and it'll show up here.")}</div>}
              {sortedConvs.map((c) => (
                <div key={c.id} className={`conv-item ${c.id === activeId ? "active" : ""}`} onClick={() => selectConversation(c.id)}>
                  <span className="label">{c.title}</span>
                  <button className="conv-delete" onClick={(e) => deleteConversation(c.id, e)} title={t("حذف", "Delete")}>✕</button>
                </div>
              ))}
            </div>
          </React.Fragment>
        ) : (
          <div className={`brand-status ${hasBrand ? "set" : ""}`}>
            {hasBrand ? t(`✓ ملف براند "${brand.name}" محفوظ ومتاح لماركو`, `✓ Brand profile "${brand.name}" saved and available to MARKO`) : t("لسه معملتيش ملف براند. احفظيه من التاب ده.", "No brand profile yet. Save one from this tab.")}
          </div>
        )}

        <div className="autopilot-box">
          <div className="autopilot-title">⚡ {t("طريقة رد ماركو", "AUTOPILOT")}</div>
          {[
            { v: "recommend", ar: "توصية بس", en: "Recommend only" },
            { v: "prepare", ar: "يجهّز وياخد موافقة", en: "Prepare & ask approval" },
            { v: "execute", ar: "جاهز للتنفيذ فورًا", en: "Ready to execute" },
          ].map((opt) => (
            <label key={opt.v} className="autopilot-opt">
              <input type="radio" name="autopilot" checked={autopilot === opt.v} onChange={() => setAutopilot(opt.v)} />
              {t(opt.ar, opt.en)}
            </label>
          ))}
          <div className="autopilot-note">{t("ده بيغيّر أسلوب رد ماركو بس — التنفيذ الفعلي (نشر، إرسال، دفع) لازم تعمليه إنتِ يدويًا برا الموقع.", "This only changes MARKO's response style — actual execution (publishing, sending, paying) is still done by you, manually, outside the app.")}</div>
        </div>

        <div className="lang-switch" style={{ margin: "8px 14px" }}>
          <button className={lang === "ar" ? "active" : ""} onClick={() => setLang("ar")}>عربي</button>
          <button className={lang === "en" ? "active" : ""} onClick={() => setLang("en")}>EN</button>
        </div>

        <div style={{ padding: "10px 14px", borderTop: "1px solid rgba(24,24,27,0.08)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: "12px", color: "rgba(24,24,27,0.55)" }}>{currentUser?.name || ""}</span>
          <button
            onClick={() => { localStorage.removeItem(USER_KEY); window.location.reload(); }}
            style={{ background: "transparent", border: "none", color: "rgba(24,24,27,0.4)", fontSize: "11.5px", cursor: "pointer" }}
          >
            {t("تسجيل خروج", "Log out")}
          </button>
        </div>
      </div>

      <div className="main-area">
        <div className="topbar">
          <button className="hamburger" onClick={() => setSidebarOpen((v) => !v)} title={t("القائمة", "Menu")}>☰</button>
          <img src={LOGO_SRC} alt="Marko" className="logo-img" />
          <div className="title-block">
            <h1>MARKO</h1>
            <p>{t("نظام الذكاء التسويقي", "MARKETING INTELLIGENCE SYSTEM")}</p>
          </div>
          {view === "chat" && activeConv && messages.length > 0 && (
            <button className="save-btn" onClick={exportConversation} title={t("تحميل المحادثة", "Download conversation")}>💾 {t("حفظ", "Save")}</button>
          )}
        </div>


        <div className="content-area" ref={contentRef}>
          {view === "overview" ? (
            <OverviewPanel
              brand={brand}
              calendar={calendar}
              crm={crm}
              conversations={conversations}
              currentUser={currentUser}
              onGoBrand={goToBrand}
              onGoCalendar={goToCalendar}
              onGoCrm={goToCrm}
              onStartAgent={startAgentChat}
              t={t}
              activity={activity}
            />
          ) : view === "brand" ? (
            <BrandPanel brand={brand} onSave={saveBrandWithLog} t={t} />
          ) : view === "calendar" ? (
            <CalendarPanel items={calendar} onAdd={addCalendarItem} onDelete={deleteCalendarItem} t={t} />
          ) : view === "crm" ? (
            <CrmPanel items={crm} onAdd={addCrmItem} onDelete={deleteCrmItem} t={t} lang={lang} />
          ) : isEmptyChat ? (
            <div className="landing">
              <img src={LOGO_SRC} alt="Marko" className="landing-logo" />
              <h1 className="landing-title">{t("أهلا، أنا Marko", "Hi, I'm MARKO")}</h1>
              <p className="landing-subtitle">{t("المستشار التنفيذي التسويقي بتاعك. قولي أقدر أساعدك إزاي؟", "Your marketing intelligence system. Tell me how I can help.")}</p>
              {hasBrand && <div className="landing-brand-chip">🏷️ {t(`شغالة على براند: ${brand.name}`, `Working on brand: ${brand.name}`)}</div>}

              {!selectedStage ? (
                <div className="stage-cards">
                  {STAGE_GROUPS.map((g) => (
                    <div key={g.id} className="stage-card" onClick={() => setSelectedStage(g.id)}>
                      <span className="stage-card-icon">{g.icon}</span>
                      <div className="stage-card-title">{t(g.title, g.titleEn || g.title)}</div>
                      <div className="stage-card-desc">{t(g.desc, g.descEn || g.desc)}</div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="stage-detail">
                  <button className="stage-back-btn" onClick={() => setSelectedStage(null)}>
                    {t("→ كل المراحل", "← All stages")}
                  </button>
                  <div className="stage-group-title">
                    {STAGE_GROUPS.find((g) => g.id === selectedStage)?.icon}{" "}
                    {t(STAGE_GROUPS.find((g) => g.id === selectedStage)?.title, STAGE_GROUPS.find((g) => g.id === selectedStage)?.titleEn)}
                  </div>
                  <div className="agent-cards">
                    {AGENTS.filter((a) => a.stage === selectedStage).map((a) => (
                      <div key={a.id} className="agent-card" onClick={() => startAgentChat(a)}>
                        <span className="agent-icon">{a.icon}</span>
                        <div className="agent-name">{t(a.name, a.nameEn || a.name)}</div>
                        <div className="agent-desc">{t(a.desc, a.descEn || a.desc)}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div className="messages">
              {messages.map((m, i) => (
                <div key={i} className={`bubble ${m.role}`}>
                  {m.image && <img src={m.image} alt={t("مرفق", "Attachment")} className="bubble-image" />}
                  {m.role === "assistant" ? <MarkdownContent content={m.content} /> : m.content}
                </div>
              ))}
              {loading && <div className="typing"><span></span><span></span><span></span></div>}
            </div>
          )}
        </div>

        {view === "chat" && (
          <div className="footer-area">
            {errorMsg && <div className="error-banner">{errorMsg}</div>}
            {ImagePreview}
            <div className="input-row">
              {AttachInput}
              <textarea
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder={isEmptyChat ? t("اكتبي بيانات البراند أو سؤالك هنا...", "Type your brand info or question here...") : t("اكتبي ردك هنا...", "Type your reply here...")}
                autoFocus
              />
              <button className="send" onClick={() => sendMessage()} disabled={loading}>{loading ? "..." : "➤"}</button>
            </div>
          </div>
        )}
      </div>

      {view !== "chat" && (
        <React.Fragment>
          {askOpen && (
            <div className="ask-marko-panel">
              <h4>✨ {t("اسألي ماركو", "Ask MARKO")}</h4>
              <textarea
                value={askText}
                onChange={(e) => setAskText(e.target.value)}
                placeholder={t("مثلاً: ليه المبيعات نازلة الأسبوع ده؟", "e.g. Why did sales drop this week?")}
                autoFocus
                onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAsk(); } }}
              />
              <div className="row">
                <button className="ov-btn" style={{ flex: 1 }} onClick={submitAsk}>{t("ابعتي", "Send")}</button>
                <button className="ov-btn ghost" onClick={() => setAskOpen(false)}>{t("إلغاء", "Cancel")}</button>
              </div>
            </div>
          )}
          <button className="ask-marko-fab" onClick={() => setAskOpen((v) => !v)}>✨ {t("اسألي ماركو", "Ask MARKO")}</button>
        </React.Fragment>
      )}
    </div>
  );
}

function Root() {
  const [user, setUser] = useState(() => loadJSON(USER_KEY, null));
  if (!user) return <AuthGate onEnter={setUser} />;
  return <MarkoApp />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
