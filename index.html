<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: #1c1e20;
    background-image: radial-gradient(circle at 85% -10%, rgba(184,146,61,0.13), transparent 45%);
    color: #ede6d6;
  }
  #root { height: 100vh; height: 100dvh; }

  .app-shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 270px;
    flex-shrink: 0;
    background: #17191b;
    border-inline-start: 1px solid rgba(237,230,214,0.08);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    transition: margin-inline-start 0.25s ease;
    position: relative;
    z-index: 20;
  }
  .sidebar.closed { margin-inline-start: -270px; }
  .sidebar-header { padding: 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(237,230,214,0.08); }
  .sidebar-logo { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; }
  .sidebar-title { font-weight: 800; font-size: 14.5px; }

  .sidebar-tabs { display: flex; gap: 4px; padding: 10px 10px 4px; }
  .sidebar-tab {
    flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; cursor: pointer;
    font-size: 11.5px; font-weight: 700; color: rgba(237,230,214,0.55);
    border: 1px solid transparent; transition: all 0.15s;
  }
  .sidebar-tab.active { background: rgba(139,168,148,0.14); color: #8ba894; border-color: rgba(139,168,148,0.3); }
  .sidebar-tab:hover:not(.active) { background: rgba(237,230,214,0.05); }

  .new-chat-btn {
    margin: 10px 14px 6px;
    display: flex; align-items: center; gap: 8px;
    background: #23282b; border: 1px solid rgba(139,168,148,0.3); color: #ede6d6;
    border-radius: 10px; padding: 10px 12px; font-family: 'Tajawal', sans-serif; font-size: 13.5px; font-weight: 700;
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
  }
  .new-chat-btn:hover { border-color: #8ba894; background: #2e3235; }
  .conv-list { flex: 1; overflow-y: auto; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 3px; }
  .conv-list::-webkit-scrollbar { width: 4px; }
  .conv-list::-webkit-scrollbar-thumb { background: rgba(237,230,214,0.12); border-radius: 4px; }
  .conv-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 10px; border-radius: 9px; cursor: pointer;
    font-size: 13px; color: rgba(237,230,214,0.75);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background 0.15s;
  }
  .conv-item:hover { background: rgba(237,230,214,0.06); }
  .conv-item.active { background: rgba(139,168,148,0.14); color: #ede6d6; }
  .conv-item span.label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-delete { opacity: 0; flex-shrink: 0; background: transparent; border: none; color: rgba(237,230,214,0.5); cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .conv-item:hover .conv-delete { opacity: 1; }
  .conv-delete:hover { color: #e08080; }
  .sidebar-empty { padding: 16px 14px; font-size: 12.5px; color: rgba(237,230,214,0.4); line-height: 1.7; }

  .sidebar-nav-btn {
    margin: 10px 14px 6px; display: flex; align-items: center; gap: 8px;
    background: transparent; border: 1px solid rgba(237,230,214,0.12); color: rgba(237,230,214,0.8);
    border-radius: 10px; padding: 10px 12px; font-family: 'Tajawal', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: border-color 0.2s;
  }
  .sidebar-nav-btn:hover { border-color: #8ba894; color: #8ba894; }
  .brand-status { padding: 10px 14px; font-size: 11.5px; color: rgba(237,230,214,0.45); line-height: 1.7; }
  .brand-status.set { color: #8ba894; }

- استراتيجية → الهدف / الجمهور / التموضع / العرض / الرسالة الأساسية / القنوات / الـ Funnel / KPIs / الجدول الزمني.
- محتوى → كل قطعة محتوى منفصلة (Hook / النص / CTA / المنصة المقترحة)، مش كل حاجة في جدول واحد ضخم.
- حملة → اسم الحملة / الهدف / الجمهور / الميزانية (لو موجودة)، وحالة كل عنصر (جاهز ✅ / مسودة 🟡 / لسه مش متبدي ⚪).
- تحليل أداء/أرقام → استخدمي أرقام حقيقية بس لو العميل دّاهالك؛ لو مفيش أرقام حقيقية وضّحي إنه افتراضي أو اطلبيها. اشرحي "إيه اللي حصل" و"ليه على الأرجح" و"إيه الخطوة الجاية"، ومَيزّي بوضوح بين حاجة "مؤكدة من بيانات العميل" وحاجة "استنتاج منطقي" وحاجة "مش معروفة".

الذكاء الإعلاني (مبادئ توجيهية، مش قوالب جامدة):
- درجة وعي الجمهور بالمنتج: الأكثر وعيًا (ركزي على العرض والسعر والـ CTA) / واعي بالمنتج (التمايز والدليل) / واعي بالحل (النتيجة المرغوبة والآلية) / واعي بالمشكلة (الألم والعواقب والحل) / غير واعي خالص (قصة أو زاوية تلفت الانتباه، مش بيع مباشر).
- درجة تشبع السوق: سوق جديد يكفيه وعد بسيط؛ سوق مشبع محتاج آلية/دليل مختلف أو زاوية هوية وتجربة جديدة بدل الوعد العام المكرر.
- مَيزّي دايمًا: الميزة (Feature) ← الفايدة الوظيفية ← الفايدة العاطفية ← نتيجة العمل النهائية (Business Outcome). الأولوية للفايدة مش لسرد المميزات.
- لو فيه وعد يحتاج تبرير، وضّحي "الآلية" (ليه هيشتغل) مش بس الوعد، وبس لو الآلية مبنية على قدرة حقيقية للمنتج مش مخترعة.
- الدليل (شهادات/أرقام) يتحط بس لو موجود فعلاً من العميل؛ لو مش موجود اكتبي "⚠️ محتاجة دليل هنا" بدل ما تخترعيه.
- الـ CTA لازم يكون واضح ومحدد وسهل — إجراء واحد واضح، مش أكتر من حاجة في نفس الوقت.

قواعد عامة تانية:
- خليكي مختصرة في الردود البسيطة، وموسّعة بس في التحليلات والاستراتيجيات اللي فعلاً محتاجة تفصيل.
- لو فيه بيانات تاريخية حقيقية اتقالت قبل كده في المحادثة، قارني بيها؛ لو مفيش، متقوليش إن فيه مقارنة سابقة.
- في أي رد فيه توصيات كبيرة، رتبيها بالأولوية ومتحطيش أكتر من توصية "عالية الأولوية" واحدة أو اتنين في نفس الوقت.
- لو بيانات البراند ناقصة وطلب العميل محتاجها، اسأليها الأول قبل ما تكملي.

لو المستخدم بعت صورة (تصميم، سكرين شوت، منتج، منافس...)، حللها من ناحية تسويقية بالتفصيل بناءً على سياق الكلام.

مهم: خلي إجابتك كاملة ومنظمة من غير ما تتقطع في النص، ولو الموضوع طويل قسّمه بعناوين وجداول واضحة بدل ما تدخل في فقرة واحدة طويلة.

عمق الرد: متكتفيش بنقاط سطحية. لكل عنصر في تحليلك (منافس، Persona، محور محتوى...) اكتبي تفصيلة أو سبب أو مثال عملي يوضح الفايدة، مش بس اسم أو عنوان مجرد. في نصوص البوستات والإعلانات، اكتبي النص كامل جاهز للنشر مباشرة، مش ملخص أو تصور عام.`;

function InlineText({ text }) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g).filter((p) => p !== "");
  return parts.map((part, i) =>
    part.startsWith("**") && part.endsWith("**") ? (
      <strong key={i}>{part.slice(2, -2)}</strong>
    ) : (
      <React.Fragment key={i}>{part}</React.Fragment>
    )
  );
}

function MarkdownContent({ content }) {
  const lines = content.split("\n");
  const blocks = [];
  let i = 0;
  const isTable = (l) => l.trim().startsWith("|");
  const isUl = (l) => /^\s*[-*]\s+/.test(l);
  const isOl = (l) => /^\s*\d+\.\s+/.test(l);
  const isHeading = (l) => /^#{1,3}\s+/.test(l);

  while (i < lines.length) {
    const line = lines[i];
    if (isTable(line)) {
      const tableLines = [];
      while (i < lines.length && isTable(lines[i])) { tableLines.push(lines[i]); i++; }
      blocks.push({ type: "table", lines: tableLines });
    } else if (isUl(line)) {
      const items = [];
      while (i < lines.length && isUl(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
      blocks.push({ type: "ul", items });
    } else if (isOl(line)) {
      const items = [];
      while (i < lines.length && isOl(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++; }
      blocks.push({ type: "ol", items });
    } else if (isHeading(line)) {
      blocks.push({ type: "heading", text: line.replace(/^#{1,3}\s+/, "") });
      i++;
    } else if (line.trim() === "") {
      i++;
    } else {
      const paraLines = [];
      while (i < lines.length && lines[i].trim() !== "" && !isTable(lines[i]) && !isUl(lines[i]) && !isOl(lines[i]) && !isHeading(lines[i])) {
        paraLines.push(lines[i]); i++;
      }
      blocks.push({ type: "p", text: paraLines.join(" ") });
    }
  }

  return (
    <div className="md-content">
      {blocks.map((b, idx) => {
        if (b.type === "table") {
          const rows = b.lines
            .map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()))
            .filter((r) => !r.every((c) => /^:?-+:?$/.test(c)));
          const [header, ...body] = rows;
          if (!header) return null;
          return (
            <table className="md-table" key={idx}>
              <thead><tr>{header.map((h, hi) => <th key={hi}><InlineText text={h} /></th>)}</tr></thead>
              <tbody>{body.map((r, ri) => <tr key={ri}>{r.map((c, ci) => <td key={ci}><InlineText text={c} /></td>)}</tr>)}</tbody>
            </table>
          );
        }
        if (b.type === "ul") return <ul className="md-list" key={idx}>{b.items.map((it, ii) => <li key={ii}><InlineText text={it} /></li>)}</ul>;
        if (b.type === "ol") return <ol className="md-list" key={idx}>{b.items.map((it, ii) => <li key={ii}><InlineText text={it} /></li>)}</ol>;
        if (b.type === "heading") return <div className="md-heading" key={idx}><InlineText text={b.text} /></div>;
        return <p className="md-p" key={idx}><InlineText text={b.text} /></p>;
      })}
    </div>
  );
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

function makeTitle(text) {
  const clean = (text || "").trim().replace(/\s+/g, " ");
  if (!clean) return "محادثة جديدة";
  return clean.length > 32 ? clean.slice(0, 32) + "…" : clean;
}

function sharedAgentContextToText(conversations, excludeId) {
  const others = conversations.filter((c) => c.id !== excludeId && c.messages && c.messages.length > 0);
  if (others.length === 0) return "";
  const recent = others.slice(0, 5);
  const blocks = recent.map((c) => {
    const lastAssistant = [...c.messages].reverse().find((m) => m.role === "assistant");
    if (!lastAssistant) return null;
    const snippet = lastAssistant.content.trim().replace(/\s+/g, " ").slice(0, 260);
    return `• محادثة "${c.title}": ${snippet}${lastAssistant.content.length > 260 ? "…" : ""}`;
  }).filter(Boolean);
  if (blocks.length === 0) return "";
  return `\n\nمخرجات سابقة من وكلاء/محادثات تانية لنفس العميل (استخدميها كسياق، وابنِ عليها بدل ما تكرري نفس التحليل من الصفر لو مناسب):\n${blocks.join("\n")}`;
}

    ["اسم البراند/الشركة", b.name],
    ["مجال العمل والمنتجات/الخدمات", b.industry],
    ["الفئة السعرية/العروض", b.priceTier],
    ["الميزة التنافسية (USP)", b.usp],
    ["الجمهور المستهدف", b.audience],
    ["المنصات المستهدفة", b.platforms],
    ["ملاحظات إضافية عن أسلوب البراند", b.notes],
  ].filter(([, v]) => v && v.trim());
  if (rows.length === 0) return "";
  const lines = rows.map(([k, v]) => `- ${k}: ${v}`).join("\n");
  return `\n\nبيانات البراند المحفوظة لهذا العميل (متاحة بالفعل، لا تطلبيها من المستخدم تاني إلا لو غيّرت رأيها):\n${lines}`;
}

          <table className="cal-table">
            <thead>
              <tr><th>التاريخ</th><th>المنصة</th><th>النوع</th><th>الموضوع</th><th>الهدف</th><th></th></tr>
            </thead>
            <tbody>
              {sorted.map((it) => (
                <tr key={it.id}>
                  <td>{it.date}</td>
                  <td>{it.platform}</td>
                  <td>{it.type}</td>
                  <td>{it.topic}</td>
                  <td>{it.goal || "—"}</td>
                  <td><button className="cal-del" onClick={() => onDelete(it.id)}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ---------------- CRM Panel ---------------- */
function CrmPanel({ items, onAdd, onDelete }) {
  const [name, setName] = useState("");
  const [contact, setContact] = useState("");
  const [status, setStatus] = useState("new");
  const [source, setSource] = useState("");
  const [notes, setNotes] = useState("");

  function handleAdd() {
    if (!name.trim()) return;
    onAdd({ id: Date.now(), name: name.trim(), contact: contact.trim(), status, source: source.trim(), notes: notes.trim(), addedAt: new Date().toISOString().slice(0, 10) });
    setName(""); setContact(""); setSource(""); setNotes("");
  }

  const statusLabel = (v) => (CRM_STATUSES.find((s) => s.value === v) || {}).label || v;
  const sorted = [...items].sort((a, b) => b.id - a.id);

  return (
    <div className="panel-wrap">
      <div className="panel-header">
        <h2>العملاء (CRM)</h2>
        <p>سجّلي الليدز والعملاء بحالتهم، وتابعي رحلتهم من أول تواصل لحد ما يبقوا عملاء فعليين.</p>
      </div>

      <div className="crm-form">
        <div className="crm-form-grid">
          <input placeholder="اسم العميل/الليد" value={name} onChange={(e) => setName(e.target.value)} />
          <input placeholder="رقم/إيميل التواصل" value={contact} onChange={(e) => setContact(e.target.value)} />
          <select value={status} onChange={(e) => setStatus(e.target.value)}>
            {CRM_STATUSES.map((s) => <option key={s.value} value={s.value}>{s.label}</option>)}
          </select>
          <input placeholder="مصدر الليد (إعلان، إحالة...)" value={source} onChange={(e) => setSource(e.target.value)} />
        </div>
        <input placeholder="ملاحظات (اختياري)" value={notes} onChange={(e) => setNotes(e.target.value)} style={{ marginBottom: "10px" }} />
        <button className="crm-add-btn" onClick={handleAdd}>+ إضافة عميل</button>
      </div>

      {sorted.length === 0 ? (
        <div className="crm-empty">مفيش عملاء مسجلين لسه. ضيفي أول عميل من الفورم فوق.</div>
      ) : (
        <div className="crm-table-wrap">
          <table className="crm-table">
            <thead>
              <tr><th>الاسم</th><th>التواصل</th><th>الحالة</th><th>المصدر</th><th>تاريخ الإضافة</th><th></th></tr>
            </thead>
            <tbody>
              {sorted.map((it) => (
                <tr key={it.id}>
                  <td>{it.name}</td>
                  <td>{it.contact || "—"}</td>
                  <td><span className={`crm-status ${it.status}`}>{statusLabel(it.status)}</span></td>
                  <td>{it.source || "—"}</td>
                  <td>{it.addedAt}</td>
                  <td><button className="crm-del" onClick={() => onDelete(it.id)}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function MarkoApp() {
  const [conversations, setConversations] = useState(() => loadJSON(CONV_KEY, []));
  const [brand, setBrand] = useState(() => loadJSON(BRAND_KEY, null));
  const [calendar, setCalendar] = useState(() => loadJSON(CAL_KEY, []));
  const [crm, setCrm] = useState(() => loadJSON(CRM_KEY, []));
  const [activeId, setActiveId] = useState(null);
  const [view, setView] = useState("chat"); // chat | brand | calendar
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [pendingImage, setPendingImage] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [selectedStage, setSelectedStage] = useState(null);
  const contentRef = useRef(null);

  useEffect(() => { saveJSON(CONV_KEY, conversations); }, [conversations]);
  useEffect(() => { saveJSON(BRAND_KEY, brand); }, [brand]);
  useEffect(() => { saveJSON(CAL_KEY, calendar); }, [calendar]);
  useEffect(() => { saveJSON(CRM_KEY, crm); }, [crm]);

  useEffect(() => {
    contentRef.current?.scrollTo({ top: contentRef.current.scrollHeight, behavior: "smooth" });
  }, [activeId, loading, conversations, view]);

  const activeConv = conversations.find((c) => c.id === activeId) || null;
  const messages = activeConv ? activeConv.messages : [];
  const isEmptyChat = !activeConv || messages.length === 0;
  const hasBrand = !!(brand && brand.name && brand.name.trim());

  function goToChat() { setView("chat"); setSidebarOpen(false); }
  function goToBrand() { setView("brand"); setSidebarOpen(false); }
  function goToCalendar() { setView("calendar"); setSidebarOpen(false); }
  function goToCrm() { setView("crm"); setSidebarOpen(false); }

  function startNewChat() {
    setActiveId(null);
    setInput("");
    setPendingImage(null);
    setErrorMsg("");
    setView("chat");
    setSidebarOpen(false);
    setSelectedStage(null);
  }

  function selectConversation(id) {
    setActiveId(id);
    setErrorMsg("");
    setView("chat");
    setSidebarOpen(false);
  }

  function deleteConversation(id, e) {
    e.stopPropagation();
    setConversations((prev) => prev.filter((c) => c.id !== id));
    if (activeId === id) setActiveId(null);
  }

  function handleFileSelect(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(",")[1];
      setPendingImage({ dataUrl, mediaType: file.type, base64 });
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function removePendingImage() { setPendingImage(null); }

  function exportConversation() {
    if (!activeConv) return;
    const lines = activeConv.messages.map((m) => {
      const who = m.role === "assistant" ? "ماركو" : "أنا";
      const imgNote = m.image ? "[صورة مرفقة]\n" : "";
      return `${who}:\n${imgNote}${m.content}\n`;
    });
    const text = lines.join("\n---\n\n");
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `marko-${stamp}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function addCalendarItem(item) { setCalendar((prev) => [...prev, item]); }
  function deleteCalendarItem(id) { setCalendar((prev) => prev.filter((c) => c.id !== id)); }
  function addCrmItem(item) { setCrm((prev) => [...prev, item]); }
  function deleteCrmItem(id) { setCrm((prev) => prev.filter((c) => c.id !== id)); }

  function startAgentChat(agent) {
    setActiveId(null);
    setPendingImage(null);
    setErrorMsg("");
    setView("chat");
    setSidebarOpen(false);
    setSelectedStage(null);
    setInput(agent.prompt);
  }

  async function sendMessage() {
    if ((!input.trim() && !pendingImage) || loading) return;
    setErrorMsg("");

    const userMsg = {
      role: "user",
      content: input.trim(),
      image: pendingImage?.dataUrl || null,
      mediaType: pendingImage?.mediaType || null,
      base64: pendingImage?.base64 || null,
    };

    let convId = activeId;
    let historyForApi;

    if (!convId) {
      convId = Date.now();
      const newConv = { id: convId, title: makeTitle(userMsg.content), messages: [userMsg] };
      setConversations((prev) => [newConv, ...prev]);
      setActiveId(convId);
      historyForApi = [userMsg];
    } else {
      setConversations((prev) =>
        prev.map((c) => (c.id === convId ? { ...c, messages: [...c.messages, userMsg] } : c))
      );
      const current = conversations.find((c) => c.id === convId);
      historyForApi = current ? [...current.messages, userMsg] : [userMsg];
    }

    setInput("");
    setPendingImage(null);
    setLoading(true);

    const effectiveSystemPrompt =
      BASE_SYSTEM_PROMPT + brandProfileToText(brand) + sharedAgentContextToText(conversations, convId);

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: controller.signal,
        body: JSON.stringify({
          system: effectiveSystemPrompt,
          messages: historyForApi.map((m) => {
            if (m.role === "user" && m.image) {
              return {
                role: "user",
                content: [
                  { type: "image", source: { type: "base64", media_type: m.mediaType, data: m.base64 } },
                  { type: "text", text: m.content || "حللي الصورة دي من ناحية تسويقية وقوليلي ملاحظاتك." },
                ],
              };
            }
            return { role: m.role, content: m.content };
          }),
        }),
      });
      clearTimeout(timeoutId);
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || data.error || "حصل خطأ في السيرفر");
      }
      const text = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("\n");
      const assistantMsg = { role: "assistant", content: text || "معلش، مش قادر أرد دلوقتي. جرّبي تاني." };
      setConversations((prev) =>
        prev.map((c) => (c.id === convId ? { ...c, messages: [...c.messages, assistantMsg] } : c))
      );
    } catch (e) {
      const msg = e.name === "AbortError" ? "الرد اتأخر أكتر من اللازم. جرّبي تبعتي تاني." : (e.message || "حصل خطأ في الاتصال بالسيرفر.");
      setErrorMsg(msg);
    } finally {
      setLoading(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  const AttachInput = (
    <label className="attach" title="إرفاق صورة">
      📎
      <input type="file" accept="image/*" onChange={handleFileSelect} style={{ display: "none" }} />
    </label>
  );

  const ImagePreview = pendingImage && (
    <div className="image-preview">
      <img src={pendingImage.dataUrl} alt="معاينة" />
      <button className="remove-image" onClick={removePendingImage}>✕</button>
    </div>
  );

  const sortedConvs = [...conversations].sort((a, b) => b.id - a.id);

  return (
    <div className="app-shell" dir="rtl">
      <div className={`sidebar-overlay ${sidebarOpen ? "show" : ""}`} onClick={() => setSidebarOpen(false)} />

      <div className={`sidebar ${sidebarOpen ? "" : "closed"}`}>
        <div className="sidebar-header">
          <img src={LOGO_SRC} alt="Marko" className="sidebar-logo" />
          <span className="sidebar-title">ماركو — MARKO</span>
        </div>

        <div className="sidebar-tabs">
          <div className={`sidebar-tab ${view === "chat" ? "active" : ""}`} onClick={goToChat}>المحادثات</div>
          <div className={`sidebar-tab ${view === "crm" ? "active" : ""}`} onClick={goToCrm}>العملاء</div>
        </div>
        <div className="sidebar-tabs" style={{ paddingTop: 0 }}>
          <div className={`sidebar-tab ${view === "brand" ? "active" : ""}`} onClick={goToBrand}>ملف البراند</div>
          <div className={`sidebar-tab ${view === "calendar" ? "active" : ""}`} onClick={goToCalendar}>التقويم</div>
        </div>

        {view === "chat" ? (
          <React.Fragment>
            <button className="new-chat-btn" onClick={startNewChat}>+ محادثة جديدة</button>
            <div className="conv-list">
              {sortedConvs.length === 0 && <div className="sidebar-empty">مفيش محادثات محفوظة لسه. ابدئي أول محادثة وهتلاقيها هنا.</div>}
              {sortedConvs.map((c) => (
                <div key={c.id} className={`conv-item ${c.id === activeId ? "active" : ""}`} onClick={() => selectConversation(c.id)}>
                  <span className="label">{c.title}</span>
                  <button className="conv-delete" onClick={(e) => deleteConversation(c.id, e)} title="حذف">✕</button>
                </div>
              ))}
            </div>
          </React.Fragment>
        ) : (
          <div className={`brand-status ${hasBrand ? "set" : ""}`}>
            {hasBrand ? `✓ ملف براند "${brand.name}" محفوظ ومتاح لماركو` : "لسه معملتيش ملف براند. احفظيه من التاب ده."}
          </div>
        )}
      </div>

      <div className="main-area">
        <div className="topbar">
          <button className="hamburger" onClick={() => setSidebarOpen((v) => !v)} title="القائمة">☰</button>
          <img src={LOGO_SRC} alt="Marko" className="logo-img" />
          <div className="title-block">
            <h1>ماركو</h1>
            <p>MARKETING OPERATING SYSTEM</p>
          </div>
          {view === "chat" && activeConv && messages.length > 0 && (
            <button className="save-btn" onClick={exportConversation} title="تحميل المحادثة">💾 حفظ</button>
          )}
        </div>


        <div className="content-area" ref={contentRef}>
          {view === "brand" ? (
            <BrandPanel brand={brand} onSave={setBrand} />
          ) : view === "calendar" ? (
            <CalendarPanel items={calendar} onAdd={addCalendarItem} onDelete={deleteCalendarItem} />
          ) : view === "crm" ? (
            <CrmPanel items={crm} onAdd={addCrmItem} onDelete={deleteCrmItem} />
          ) : isEmptyChat ? (
            <div className="landing">
              <img src={LOGO_SRC} alt="Marko" className="landing-logo" />
              <h1 className="landing-title">أهلا، أنا Marko</h1>
              <p className="landing-subtitle">المستشار التنفيذي التسويقي بتاعك. قولي أقدر أساعدك إزاي؟</p>
              {hasBrand && <div className="landing-brand-chip">🏷️ شغالة على براند: {brand.name}</div>}

              {!selectedStage ? (
                <div className="stage-cards">
                  {STAGE_GROUPS.map((g) => (
                    <div key={g.id} className="stage-card" onClick={() => setSelectedStage(g.id)}>
                      <span className="stage-card-icon">{g.icon}</span>
                      <div className="stage-card-title">{g.title}</div>
                      <div className="stage-card-desc">{g.desc}</div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="stage-detail">
                  <button className="stage-back-btn" onClick={() => setSelectedStage(null)}>
                    → كل المراحل
                  </button>
                  <div className="stage-group-title">
                    {STAGE_GROUPS.find((g) => g.id === selectedStage)?.icon}{" "}
                    {STAGE_GROUPS.find((g) => g.id === selectedStage)?.title}
                  </div>
                  <div className="agent-cards">
                    {AGENTS.filter((a) => a.stage === selectedStage).map((a) => (
                      <div key={a.id} className="agent-card" onClick={() => startAgentChat(a)}>
                        <span className="agent-icon">{a.icon}</span>
                        <div className="agent-name">{a.name}</div>
                        <div className="agent-desc">{a.desc}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div className="messages">
              {messages.map((m, i) => (
                <div key={i} className={`bubble ${m.role}`}>
                  {m.image && <img src={m.image} alt="مرفق" className="bubble-image" />}
                  {m.role === "assistant" ? <MarkdownContent content={m.content} /> : m.content}
                </div>
              ))}
              {loading && <div className="typing"><span></span><span></span><span></span></div>}
            </div>
          )}
        </div>

        {view === "chat" && (
          <div className="footer-area">
            {errorMsg && <div className="error-banner">{errorMsg}</div>}
            {ImagePreview}
            <div className="input-row">
              {AttachInput}
              <textarea
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder={isEmptyChat ? "اكتبي بيانات البراند أو سؤالك هنا..." : "اكتبي ردك هنا..."}
                autoFocus
              />
              <button className="send" onClick={sendMessage} disabled={loading}>{loading ? "..." : "➤"}</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MarkoApp />);
</script>
</body>
</html>
