<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: #12181c;
    background-image: radial-gradient(circle at 85% -10%, rgba(184,146,61,0.10), transparent 45%);
    color: #ede6d6;
  }
  #root { min-height: 100vh; }
  .marko-app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .shell { width: 100%; max-width: 640px; display: flex; flex-direction: column; height: 92vh; }
  .logo-img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .header { display: flex; align-items: center; gap: 14px; padding-bottom: 18px; border-bottom: 1px solid rgba(237,230,214,0.1); margin-bottom: 16px; }
  .title-block h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 0.3px; }
  .title-block p { margin: 2px 0 0; font-size: 12.5px; color: rgba(237,230,214,0.55); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.4px; }
  .stage-rail { display: flex; align-items: center; margin-bottom: 18px; padding: 0 2px; }
  .stage-node { display: flex; align-items: center; flex: 1; }
  .stage-node:last-child { flex: 0; }
  .stage-dot { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(237,230,214,0.25); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: rgba(237,230,214,0.45); flex-shrink: 0; transition: all 0.3s ease; }
  .stage-node.on .stage-dot { border-color: #b8923d; background: #b8923d; color: #12181c; font-weight: 700; }
  .stage-label { font-size: 10.5px; color: rgba(237,230,214,0.4); margin-inline-start: 6px; margin-inline-end: 10px; white-space: nowrap; display: none; }
  .stage-node.on .stage-label { color: rgba(237,230,214,0.75); }
  .stage-line { flex: 1; height: 1.5px; background: rgba(237,230,214,0.15); margin: 0 4px; }
  .stage-line.on { background: #b8923d; }
  @media (min-width: 480px) { .stage-label { display: inline; } }

  .landing { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; text-align: center; margin: auto; }
  .landing-logo { width: 84px; height: 84px; border-radius: 20px; object-fit: cover; box-shadow: 0 8px 30px rgba(184,146,61,0.18); margin-bottom: 22px; }
  .landing-title { font-size: 26px; font-weight: 900; margin: 0 0 8px; }
  .landing-subtitle { font-size: 14.5px; color: rgba(237,230,214,0.6); margin: 0 0 34px; line-height: 1.7; }
  .landing-input-row { width: 100%; margin-top: 0; }

  .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 12px; }
  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(237,230,214,0.15); border-radius: 4px; }

  .bubble { max-width: 85%; padding: 12px 16px; border-radius: 14px; font-size: 14.5px; line-height: 1.85; white-space: pre-wrap; }
  .bubble.assistant { align-self: flex-start; background: #1b2328; border: 1px solid rgba(237,230,214,0.08); border-start-start-radius: 4px; }
  .bubble.user { align-self: flex-end; background: linear-gradient(135deg, #3e6b63, #2c4d47); color: #f2f6f4; border-start-end-radius: 4px; }
  .bubble-image { max-width: 220px; border-radius: 10px; display: block; margin-bottom: 8px; }

  .md-content { display: flex; flex-direction: column; gap: 10px; }
  .md-p { margin: 0; }
  .md-heading { font-weight: 700; font-size: 15px; color: #d9b96a; margin-top: 2px; }
  .md-list { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 5px; }
  .md-table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 2px 0; }
  .md-table th, .md-table td { border: 1px solid rgba(237,230,214,0.14); padding: 7px 10px; text-align: right; }
  .md-table th { background: rgba(184,146,61,0.14); color: #d9b96a; font-weight: 700; }
  .md-table tr:nth-child(even) td { background: rgba(237,230,214,0.03); }

  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 14px 16px; background: #1b2328; border-radius: 14px; border-start-start-radius: 4px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: #b8923d; animation: bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .image-preview { position: relative; display: inline-flex; width: fit-content; margin-bottom: 8px; }
  .image-preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(237,230,214,0.15); }
  .remove-image { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; border-radius: 50%; background: #1b2328; border: 1px solid rgba(237,230,214,0.25); color: #ede6d6; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; font-size: 12px; line-height: 1; }

  label.attach { width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px; background: #1b2328; border: 1px solid rgba(237,230,214,0.12); color: rgba(237,230,214,0.75); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.2s; font-size: 18px; }
  label.attach:hover { border-color: #68c485; color: #68c485; }

  .input-row { display: flex; gap: 10px; margin-top: 14px; align-items: flex-end; }
  textarea { flex: 1; resize: none; background: #1b2328; border: 1px solid rgba(237,230,214,0.12); border-radius: 12px; color: #ede6d6; font-family: 'Tajawal', sans-serif; font-size: 14.5px; padding: 12px 14px; min-height: 46px; max-height: 120px; outline: none; }
  textarea:focus { border-color: #b8923d; }

  button.send { background: #68c485; color: #0f1c14; border: none; border-radius: 12px; padding: 0 18px; height: 46px; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }
  button.send:focus-visible { outline: 2px solid #ede6d6; outline-offset: 2px; }

  .error-banner { background: rgba(200,80,80,0.12); border: 1px solid rgba(200,80,80,0.3); color: #f0b8b8; font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; }
</style>

function InlineText({ text }) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g).filter((p) => p !== "");
  return parts.map((part, i) =>
    part.startsWith("**") && part.endsWith("**") ? (
      <strong key={i}>{part.slice(2, -2)}</strong>
    ) : (
      <React.Fragment key={i}>{part}</React.Fragment>
    )
  );
}

function MarkdownContent({ content }) {
  const lines = content.split("\n");
  const blocks = [];
  let i = 0;
  const isTable = (l) => l.trim().startsWith("|");
  const isUl = (l) => /^\s*[-*]\s+/.test(l);
  const isOl = (l) => /^\s*\d+\.\s+/.test(l);
  const isHeading = (l) => /^#{1,3}\s+/.test(l);

  while (i < lines.length) {
    const line = lines[i];
    if (isTable(line)) {
      const tableLines = [];
      while (i < lines.length && isTable(lines[i])) { tableLines.push(lines[i]); i++; }
      blocks.push({ type: "table", lines: tableLines });
    } else if (isUl(line)) {
      const items = [];
      while (i < lines.length && isUl(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
      blocks.push({ type: "ul", items });
    } else if (isOl(line)) {
      const items = [];
      while (i < lines.length && isOl(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++; }
      blocks.push({ type: "ol", items });
    } else if (isHeading(line)) {
      blocks.push({ type: "heading", text: line.replace(/^#{1,3}\s+/, "") });
      i++;
    } else if (line.trim() === "") {
      i++;
    } else {
      const paraLines = [];
      while (i < lines.length && lines[i].trim() !== "" && !isTable(lines[i]) && !isUl(lines[i]) && !isOl(lines[i]) && !isHeading(lines[i])) {
        paraLines.push(lines[i]); i++;
      }
      blocks.push({ type: "p", text: paraLines.join(" ") });
    }
  }

  return (
    <div className="md-content">
      {blocks.map((b, idx) => {
        if (b.type === "table") {
          const rows = b.lines
            .map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()))
            .filter((r) => !r.every((c) => /^:?-+:?$/.test(c)));
          const [header, ...body] = rows;
          if (!header) return null;
          return (
            <table className="md-table" key={idx}>
              <thead><tr>{header.map((h, hi) => <th key={hi}><InlineText text={h} /></th>)}</tr></thead>
              <tbody>{body.map((r, ri) => <tr key={ri}>{r.map((c, ci) => <td key={ci}><InlineText text={c} /></td>)}</tr>)}</tbody>
            </table>
          );
        }
        if (b.type === "ul") return <ul className="md-list" key={idx}>{b.items.map((it, ii) => <li key={ii}><InlineText text={it} /></li>)}</ul>;
        if (b.type === "ol") return <ol className="md-list" key={idx}>{b.items.map((it, ii) => <li key={ii}><InlineText text={it} /></li>)}</ol>;
        if (b.type === "heading") return <div className="md-heading" key={idx}><InlineText text={b.text} /></div>;
        return <p className="md-p" key={idx}><InlineText text={b.text} /></p>;
      })}
    </div>
  );
}

function StageRail({ activeStage }) {
  return (
    <div className="stage-rail" dir="rtl">
      {STAGES.map((s, i) => (
        <div key={s.id} className={`stage-node ${s.id <= activeStage ? "on" : ""}`}>
          <div className="stage-dot">{s.id}</div>
          <span className="stage-label">{s.label}</span>
          {i < STAGES.length - 1 && <div className={`stage-line ${s.id < activeStage ? "on" : ""}`} />}
        </div>
      ))}
    </div>
  );
}

function MarkoApp() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [activeStage] = useState(1);
  const [pendingImage, setPendingImage] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const scrollRef = useRef(null);
  const isEmpty = messages.length === 0;

  useEffect(() => {
    scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" });
  }, [messages, loading]);

  function handleFileSelect(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(",")[1];
      setPendingImage({ dataUrl, mediaType: file.type, base64 });
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function removePendingImage() { setPendingImage(null); }

  async function sendMessage() {
    if ((!input.trim() && !pendingImage) || loading) return;
    setErrorMsg("");
    const userMsg = {
      role: "user",
      content: input.trim(),
      image: pendingImage?.dataUrl || null,
      mediaType: pendingImage?.mediaType || null,
      base64: pendingImage?.base64 || null,
    };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setInput("");
    setPendingImage(null);
    setLoading(true);

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: SYSTEM_PROMPT,
          messages: newMessages.map((m) => {
            if (m.role === "user" && m.image) {
              return {
                role: "user",
                content: [
                  { type: "image", source: { type: "base64", media_type: m.mediaType, data: m.base64 } },
                  { type: "text", text: m.content || "حللي الصورة دي من ناحية تسويقية وقوليلي ملاحظاتك." },
                ],
              };
            }
            return { role: m.role, content: m.content };
          }),
        }),
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || data.error || "حصل خطأ في السيرفر");
      }
      const text = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("\n");
      setMessages((prev) => [...prev, { role: "assistant", content: text || "معلش، مش قادر أرد دلوقتي. جرّبي تاني." }]);
    } catch (e) {
      setErrorMsg(e.message || "حصل خطأ في الاتصال بالسيرفر.");
    } finally {
      setLoading(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  const AttachInput = (
    <label className="attach" title="إرفاق صورة">
      📎
      <input type="file" accept="image/*" onChange={handleFileSelect} style={{ display: "none" }} />
    </label>
  );

  const ImagePreview = pendingImage && (
    <div className="image-preview">
      <img src={pendingImage.dataUrl} alt="معاينة" />
      <button className="remove-image" onClick={removePendingImage}>✕</button>
    </div>
  );

  return (
    <div className="marko-app" dir="rtl">
      {isEmpty ? (
        <div className="landing">
          <img src={LOGO_SRC} alt="Marko" className="landing-logo" />
          <h1 className="landing-title">أهلا، أنا Marko</h1>
          <p className="landing-subtitle">المستشار التنفيذي التسويقي بتاعك. قولي أقدر أساعدك إزاي؟</p>
          {errorMsg && <div className="error-banner">{errorMsg}</div>}
          {ImagePreview}
          <div className="input-row landing-input-row">
            {AttachInput}
            <textarea
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="اكتبي بيانات البراند أو سؤالك هنا..."
              autoFocus
            />
            <button className="send" onClick={sendMessage} disabled={loading}>{loading ? "..." : "➤"}</button>
          </div>
        </div>
      ) : (
        <div className="shell">
          <div className="header">
            <img src={LOGO_SRC} alt="Marko" className="logo-img" />
            <div className="title-block">
              <h1>ماركو — MARKO</h1>
              <p>MARKETING OPERATING SYSTEM</p>
            </div>
          </div>

          <StageRail activeStage={activeStage} />

          <div className="messages" ref={scrollRef}>
            {messages.map((m, i) => (
              <div key={i} className={`bubble ${m.role}`}>
                {m.image && <img src={m.image} alt="مرفق" className="bubble-image" />}
                {m.role === "assistant" ? <MarkdownContent content={m.content} /> : m.content}
              </div>
            ))}
            {loading && <div className="typing"><span></span><span></span><span></span></div>}
          </div>

          {errorMsg && <div className="error-banner">{errorMsg}</div>}
          {ImagePreview}

          <div className="input-row">
            {AttachInput}
            <textarea
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="اكتبي بيانات البراند أو ردك هنا..."
            />
            <button className="send" onClick={sendMessage} disabled={loading}>{loading ? "..." : "➤"}</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MarkoApp />);
</script>
</body>
</html>
